# The drivine CLI's contract (cli/): its cases, cli/cli.yaml, checked against what cli/README.md says a case is, with no
# CLI and no store. The libraries run the cases themselves, against each store; this catches a case they couldn't read.
name: CLI cases

on:
  pull_request:
    paths: ['cli/**', '.github/workflows/cli.yml', '.github/scripts/cli-cases-check*']
  push:
    branches: [main]
    paths: ['cli/**', '.github/workflows/cli.yml', '.github/scripts/cli-cases-check*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cases:
    name: cli.yaml as the README says
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Python 3.12 set, not the image's own python3, which changes with ubuntu-latest and may be one PyYAML 6.0.2 has
      # no wheel for, as 3.14.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '3.12' }
      # PyYAML 6.0.2 as a wheel, by PyPI's SHA-256 of its Linux x86_64 wheel for Python 3.12, into a venv of the job's
      # own. --only-binary, so pip never builds it, which would fetch build tools no hash covers.
      - name: PyYAML
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          cat > "$RUNNER_TEMP/requirements.txt" <<'EOF'
          pyyaml==6.0.2 \
              --hash=sha256:80bab7bfc629882493af4aa31a4cfa43a4c57c83813253626916b8c7ada83476
          EOF
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --only-binary :all: --require-hashes -r "$RUNNER_TEMP/requirements.txt"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: The check's own test
        run: .github/scripts/cli-cases-check-test.sh
      - name: cli/cli.yaml
        run: .github/scripts/cli-cases-check.py cli/cli.yaml cli/README.md
