# The Cypher compiler (compiler/): its JVM tests, and every other target checked against the JVM, byte for byte.
name: Compiler

on:
  pull_request:
    paths: ['compiler/**', '*.yaml', '.github/workflows/compiler.yml', '.github/actions/pinned-toolchain/**', '.github/scripts/compiler-npm-*.sh', '.github/scripts/compiler-release-dependencies.sh', '.github/scripts/compiler-konan-dependencies.sh', 'LICENSE']
  push:
    branches: [main]
    paths: ['compiler/**', '*.yaml', '.github/workflows/compiler.yml', '.github/actions/pinned-toolchain/**', '.github/scripts/compiler-npm-*.sh', '.github/scripts/compiler-release-dependencies.sh', '.github/scripts/compiler-konan-dependencies.sh', 'LICENSE']
  workflow_dispatch:
  # compiler-release.yml runs this first, on the tag it releases, so a tag doesn't run it twice.
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    # Named, so a step runs with pipefail: a check piped into tee still fails the step.
    shell: bash
    working-directory: compiler

# Each job runs on the JDK gradle/pinned-jdk.properties pins, exactly: its tzdb is the zones the compiler takes. It and the
# Gradle distribution are installed from their checked archives, kept in the cache (.github/actions/pinned-toolchain).
# Gradle checks every dependency it fetches or finds cached against gradle/verification-metadata.xml, and refuses one
# whose SHA-256 isn't there (compiler/README.md, "Dependency verification").
jobs:
  jvm:
    name: JVM tests, double fuzz and metadata compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # No token left on disk while the build runs Gradle and its plugins: no step here needs git credentials.
        with: { persist-credentials: false }
      - uses: ./.github/actions/pinned-toolchain
      # Stay on setup-gradle 5.x: v6's caching is a proprietary component under Gradle's terms, which we don't take.
      # v5.0.2 is the last v5, and security fixes now ship only on v6; we don't use dependency-submission.
      # Re-check on each GitHub advisory for gradle/actions.
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      # Clean, as the wasm optimize step leaves stale output behind.
      - run: ./gradlew --no-daemon clean jvmTest metadataCompile
      - name: The sync from drivine4j, over a made-up drivine4j
        run: scripts/test-sync.sh
      # As drivine4j publishes it from a pinned commit, into a repository of its own: the POMs and module metadata build.
      - name: The Maven publications
        run: ./gradlew --no-daemon publishJvmPublicationToMavenLocal publishKotlinMultiplatformPublicationToMavenLocal -Pcompiler.version=0.0.0-ci -Dmaven.repo.local="$RUNNER_TEMP/compiler-repo"
      - name: Summary
        if: always()
        run: ../.github/scripts/compiler-summary.sh build/test-results/jvmTest >> "$GITHUB_STEP_SUMMARY"

  wasmjs:
    name: wasmJs (Node 22) double fuzz and corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # No token left on disk while the build runs Gradle and its plugins: no step here needs git credentials.
        with: { persist-credentials: false }
      - uses: ./.github/actions/pinned-toolchain
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22' }
      # Stay on setup-gradle 5.x: v6's caching is a proprietary component under Gradle's terms, which we don't take.
      # v5.0.2 is the last v5, and security fixes now ship only on v6; we don't use dependency-submission.
      # Re-check on each GitHub advisory for gradle/actions.
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: The npm corpus check, over made-up packages
        run: check/corpus-node-test.sh
      - name: The npm package's check, over made-up tarballs
        run: ../.github/scripts/compiler-npm-check-test.sh
      - run: ./gradlew --no-daemon clean wasmJsNodeTest wasmJsCorpusCheck -Pnode="$(command -v node)" | tee corpus.log
      # The package as npm gives it: packed, installed into an empty project with only the dependencies it names, then
      # every corpus request compiled through it, byte for byte the JVM's.
      - name: The packed npm package, installed in an empty project, compiles the corpus as the JVM does
        run: |
          tgz="$(npm pack ./build/npm --pack-destination build --silent | tail -n 1)"
          ../.github/scripts/compiler-npm-check.sh "build/$tgz" "$(node -p 'require("./build/npm/package.json").version')" "$(grep '^compiler.npmName=' gradle.properties | cut -d= -f2-)"
          ../.github/scripts/compiler-npm-clean-install.sh "build/$tgz" build/oracle/corpus.jsonl build/oracle/differences-npm.jsonl | tee -a corpus.log
      - name: Summary
        if: always()
        run: ../.github/scripts/compiler-summary.sh build/test-results/wasmJsNodeTest corpus.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: wasmjs-differences, path: compiler/build/oracle/differences-*.jsonl, if-no-files-found: ignore }

  native-linux:
    name: linuxX64 double fuzz and corpus, and the other native targets built
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # No token left on disk while the build runs Gradle and its plugins: no step here needs git credentials.
        with: { persist-credentials: false }
      - uses: ./.github/actions/pinned-toolchain
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '3.12' }
      # Stay on setup-gradle 5.x: v6's caching is a proprietary component under Gradle's terms, which we don't take.
      # v5.0.2 is the last v5, and security fixes now ship only on v6; we don't use dependency-submission.
      # Re-check on each GitHub advisory for gradle/actions.
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('compiler/build.gradle.kts') }}
      - name: The Python wheels' check, over made-up libraries
        run: python python/check_wheel_test.py
      # apsw, a SQLite that loads extensions, for the extension's check: by hash (check/extension-requirements.txt).
      - name: apsw, for the SQLite extension's check
        run: python -m pip install --require-hashes --no-deps --only-binary :all: -r check/extension-requirements.txt
      - run: ./gradlew --no-daemon clean linuxX64Test nativeCorpusCheck nativeExtensionCheck -Ppython="$(command -v python)" | tee corpus.log
      # The version script (native/exports.map) leaves the C API and the SQLite extension's entry the library's only
      # exports, and no SQLite symbol is linked: the extension calls the loading SQLite's routines alone.
      - name: The shared library exports the C API alone, and imports no SQLite
        run: |
          library=build/bin/linuxX64/drivinecypherReleaseShared/libdrivinecypher.so
          nm -D --defined-only "$library" | awk '{ print $NF }' | sort > exports.txt
          diff <(printf 'drivine_compile\ndrivine_free\ndrivine_gc_collect\nsqlite3_drivinecypher_init\n') exports.txt || { echo "::error::libdrivinecypher.so exports other than native/exports.map's."; exit 1; }
          if nm -D --undefined-only "$library" | grep sqlite3; then echo "::error::libdrivinecypher.so links SQLite symbols."; exit 1; fi
      - name: The shared library for linuxArm64 and mingwX64, cross-compiled
        run: ./gradlew --no-daemon linkDrivinecypherReleaseSharedLinuxArm64 linkDrivinecypherReleaseSharedMingwX64
      # Windows exports what Kotlin/Native's .def names: the C API, the SQLite extension's entry, and drivinecypher_symbols.
      - name: The Windows library's .def names the C API alone
        run: |
          diff <(printf 'drivine_compile\ndrivine_free\ndrivine_gc_collect\ndrivinecypher_symbols\nsqlite3_drivinecypher_init\n') <(tr -d '\r' < build/bin/mingwX64/drivinecypherReleaseShared/drivinecypher.def | grep -v '^EXPORTS$' | LC_ALL=C sort) || { echo "::error::drivinecypher.def names other exports."; exit 1; }
      - name: Summary
        if: always()
        run: ../.github/scripts/compiler-summary.sh build/test-results/linuxX64Test corpus.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: linux-differences, path: compiler/build/oracle/differences-*.jsonl, if-no-files-found: ignore }

  native-macos:
    name: macosArm64 double fuzz and corpus
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # No token left on disk while the build runs Gradle and its plugins: no step here needs git credentials.
        with: { persist-credentials: false }
      - uses: ./.github/actions/pinned-toolchain
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '3.12' }
      # Stay on setup-gradle 5.x: v6's caching is a proprietary component under Gradle's terms, which we don't take.
      # v5.0.2 is the last v5, and security fixes now ship only on v6; we don't use dependency-submission.
      # Re-check on each GitHub advisory for gradle/actions.
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('compiler/build.gradle.kts') }}
      - name: apsw, for the SQLite extension's check
        run: python -m pip install --require-hashes --no-deps --only-binary :all: -r check/extension-requirements.txt
      - run: ./gradlew --no-daemon clean macosArm64Test nativeCorpusCheck nativeExtensionCheck -Ppython="$(command -v python)" | tee corpus.log
      # The symbol list (native/exports.txt) leaves the C API and the SQLite extension's entry the library's only
      # exports, and no SQLite symbol is linked.
      - name: The shared library exports the C API alone, and imports no SQLite
        run: |
          library=build/bin/macosArm64/drivinecypherReleaseShared/libdrivinecypher.dylib
          diff native/exports.txt <(nm -gU "$library" | awk '{ print $NF }' | sort) || { echo "::error::libdrivinecypher.dylib exports other than native/exports.txt's."; exit 1; }
          if nm -u "$library" | grep sqlite3; then echo "::error::libdrivinecypher.dylib links SQLite symbols."; exit 1; fi
      - name: Summary
        if: always()
        run: ../.github/scripts/compiler-summary.sh build/test-results/macosArm64Test corpus.log >> "$GITHUB_STEP_SUMMARY"

  # The release build's dependencies, kept in the Actions cache for compiler-release.yml (compiler/README.md,
  # "Releasing"): Gradle's downloaded files, the JDK and Gradle archives, and Kotlin/Native's own dependencies, as a build
  # of the release fetches them. The release takes only files from them, and checks each as it uses it, so what the entry
  # holds can't change what is released. One entry for each set of pins (and of compiler-release-dependencies.sh, whose
  # layout it is), which the key hashes, kept by the first run that finds none; a run that finds it kept does nothing
  # more. Not in a tag's run (as compiler-release.yml's gate), whose caches only that tag's runs read, nor on
  # a pull request from a fork, whose 1.2 GB entry no release reads and which could push main's out of the cache.
  release-dependencies:
    name: The release build's dependencies, kept for the release
    if: github.ref_type != 'tag' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # No token left on disk while the build runs Gradle and its plugins: no step here needs git credentials.
        with: { persist-credentials: false }
      # As compiler-release.yml's dependencies job names it: keep the two in step.
      - name: The cache key
        id: key
        env:
          PINS: ${{ hashFiles('compiler/gradle/verification-metadata.xml', 'compiler/gradle/kotlin-native-dependencies.txt', 'compiler/gradle/pinned-jdk.properties', 'compiler/gradle/wrapper/gradle-wrapper.properties', '.github/scripts/compiler-release-dependencies.sh') }}
        run: echo "key=compiler-release-dependencies-v2-$RUNNER_OS-$RUNNER_ARCH-$PINS" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        id: kept
        with:
          path: ~/release-dependencies
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - if: steps.kept.outputs.cache-hit != 'true'
        uses: ./.github/actions/pinned-toolchain
      - name: Kotlin/Native's dependencies, checked
        if: steps.kept.outputs.cache-hit != 'true'
        run: ../.github/scripts/compiler-konan-dependencies.sh fetch gradle/kotlin-native-dependencies.txt
      - name: Kotlin/Native can fetch nothing of its own
        if: steps.kept.outputs.cache-hit != 'true'
        run: ../.github/scripts/compiler-konan-dependencies.sh block
      # What compiler-release.yml's build job builds, so Gradle and Kotlin/Native fetch what it uses: its pythonWheels
      # as the four shared libraries it packs, as packing them fetches nothing.
      - name: The release's build
        if: steps.kept.outputs.cache-hit != 'true'
        run: ./gradlew --no-daemon --dependency-verification strict zipAggregationPublication npmPackage jvmOracle linkDrivinecypherReleaseSharedMacosArm64 linkDrivinecypherReleaseSharedLinuxX64 linkDrivinecypherReleaseSharedLinuxArm64 linkDrivinecypherReleaseSharedMingwX64 -Pcompiler.version=0.0.0-dependencies
      - name: Kotlin/Native used only its pinned dependencies
        if: steps.kept.outputs.cache-hit != 'true'
        run: ../.github/scripts/compiler-konan-dependencies.sh check gradle/kotlin-native-dependencies.txt
      - name: The dependencies, as files
        if: steps.kept.outputs.cache-hit != 'true'
        run: ../.github/scripts/compiler-release-dependencies.sh stage "$HOME/release-dependencies"
      - if: steps.kept.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/release-dependencies
          key: ${{ steps.key.outputs.key }}
