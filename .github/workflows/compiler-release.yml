# Releases the Cypher compiler (compiler/) to Maven Central, as org.drivine:drivine-cypher-compiler, and its wasmJs build
# to npm, as gradle.properties' compiler.npmName. compiler/README.md ("Releasing") describes the process.
#
# - A push of a tag vX.Y.Z on main publishes the compiler as version X.Y.Z: a spec tag is a compiler release, so the
#   compiler and the spec it was checked against share one number. A tag that changes only the spec publishes the
#   compiler again, unchanged, under the new number.
# - The compiler's CI (compiler.yml) runs first, then every target's publication is built once, unsigned, into one
#   bundle, which is checked and kept as the run's artifact. The upload waits in the `release` environment for its
#   reviewer's approval, then signs that bundle with the release key and uploads it to the Central Portal as one
#   deployment, which releases every target or none. What is published is the bundle that was checked, byte for byte,
#   with a signature beside each file; nothing is built, and no JDK, Gradle or dependency fetched, after the gate.
# - The npm package is built and checked in the same job, and kept beside the bundle. Its publish is a job of its own,
#   also waiting in `release`: it publishes the tarball that was checked, with npm's provenance, and a failure of
#   either publish neither undoes nor holds up the other.
# - workflow_dispatch, and a pull request that changes the release machinery, are dry runs: everything but the uploads
#   to the Portal and to npm, the bundle signed with a throwaway key, with GitHub's release downloads blocked, kept as
#   the run's artifact, and uploaded to a stand-in for the Portal on the runner, and the npm tarball given to npm
#   publish --dry-run.
# - The jobs that build install the pinned JDK and Gradle with .github/actions/pinned-toolchain, from checked archives:
#   the gate's jobs keep them in the cache, so a GitHub release-download outage, which failed v0.31.0's publish, doesn't
#   hold up a gate whose cache is warm.
# - The build job restores no cache: an entry is unpacked by tar -P, which writes wherever its names point, and any job
#   that can save an entry (the gate's, with third-party actions and what they fetch) could have saved it. It takes its
#   dependencies from the dependencies job instead: that job restores the entry compiler.yml's release-dependencies job
#   kept, on a runner of its own, and uploads its files as an artifact, which build unpacks only once every name in it is
#   a plain file at a path that entry holds (.github/scripts/compiler-release-dependencies.sh), and keeps only the files
#   whose SHA-256s are the pinned ones, so a wrong one is fetched, not used. Each file is then checked again as it is
#   used: Gradle's against gradle/verification-metadata.xml, the JDK's and Gradle's archives and
#   Kotlin/Native's dependencies against their pinned SHA-256s. So the entry, whoever saved it, can't change what is
#   built: at worst, the build fetches what it lacks, with retries, as it fetches everything where no entry is kept, and
#   an outage then fails it, before the reviewer is asked, and it is re-run.
name: Compiler release

on:
  push:
    tags: ['v*']
  # Always a dry run. Pick the branch or tag to try in "Use workflow from".
  workflow_dispatch:
  # A dry run, so a change to the release machinery is tested on its pull request.
  pull_request:
    paths:
      - .github/workflows/compiler-release.yml
      - .github/workflows/compiler.yml
      - .github/scripts/compiler-release-check.sh
      - .github/scripts/compiler-release-sign.sh
      - .github/scripts/compiler-release-sign-test.sh
      - .github/scripts/compiler-release-upload.sh
      - .github/scripts/compiler-npm-check.sh
      - .github/scripts/compiler-npm-check-test.sh
      - .github/scripts/compiler-npm-clean-install.sh
      - .github/scripts/compiler-release-dependencies.sh
      - .github/scripts/compiler-release-dependencies-test.sh
      - .github/scripts/compiler-konan-dependencies.sh
      - compiler/check/corpus-node.cjs
      - .github/actions/pinned-toolchain/**
      - compiler/npm/**
      - LICENSE
      - compiler/build.gradle.kts
      - compiler/settings.gradle.kts
      - compiler/gradle.properties
      - compiler/gradle/pinned-jdk.properties
      - compiler/gradle/verification-metadata.xml
      - compiler/gradle/kotlin-native-dependencies.txt
      - compiler/gradle/wrapper/gradle-wrapper.properties
      - compiler/gradle/wrapper/gradle-wrapper.jar

permissions:
  contents: read

# A release waits for the one before it on the same tag. A dry run has a group of its own, so it never cancels a
# release that is waiting.
concurrency:
  group: ${{ github.event_name == 'push' && format('compiler-release-{0}', github.ref) || format('compiler-release-dry-run-{0}', github.run_id) }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: compiler

env:
  # The artifacts published to Maven Central: the root publication, which names the others, and one for each target.
  ARTIFACTS: >-
    drivine-cypher-compiler
    drivine-cypher-compiler-jvm
    drivine-cypher-compiler-wasm-js
    drivine-cypher-compiler-macosarm64
    drivine-cypher-compiler-linuxx64
    drivine-cypher-compiler-linuxarm64
    drivine-cypher-compiler-mingwx64
  # The npm that publishes, as desk's and Drivine for TypeScript's releases pin it: npm's latest can be a new major, and
  # trusted publishing needs 11.5.1 or later. Its tarball is installed only once it has the integrity pinned here, the
  # registry's dist.integrity of this version (npm view npm@<version> dist.integrity): npm bundles its dependencies, so
  # the tarball is all of it. A bump changes both.
  NPM_CLI_VERSION: 11.21.1
  NPM_CLI_INTEGRITY: sha512-YTzL6QBEJXyHcTu0JiUc7RKMp+mzlJtl7rGLmERaXUQeFHIMc9atdr6G9M9C8vDWbv40epoTQAzNL2/PtZVDhQ==

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The build job runs this commit's ./gradlew, and builds the bundle publish signs: its gradle-wrapper.jar, a
      # binary a review can't read, has to be one Gradle released.
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: The version
        id: version
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            tag="$GITHUB_REF_NAME"
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::The tag $tag isn't vX.Y.Z (or vX.Y.Z-suffix), so it releases nothing. Delete it and tag the commit vX.Y.Z."
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
              echo "::error::The tag $tag is on $GITHUB_SHA, which isn't on $DEFAULT_BRANCH. Tag a commit on $DEFAULT_BRANCH, or, if the tag was pushed before $DEFAULT_BRANCH, push $DEFAULT_BRANCH and re-run this workflow."
              exit 1
            fi
            version="${tag#v}"
            publish=true
          else
            # A dry run builds a version no release has, so it can't be mistaken for one.
            version=0.0.0-dry-run
            publish=false
          fi
          echo "Version $version, publish: $publish"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  # The compiler's CI, as compiler.yml runs it on a pull request: the JVM tests, and every other target checked against
  # the JVM, byte for byte.
  gate:
    needs: check
    uses: ./.github/workflows/compiler.yml

  # The release build's dependencies, as compiler.yml's release-dependencies job keeps them in the cache, restored here
  # and uploaded as this run's artifact, for build to check and unpack. Here, not in build: actions/cache unpacks an
  # entry with tar -P, which writes wherever the entry's names point, so an entry made to harm a runner harms only this
  # one, which holds no secret and builds nothing (its token reads the repository's contents). Where none is kept, or the
  # upload fails, it uploads nothing and build fetches every dependency; it never fails the run, nor holds up build,
  # which runs however it ends (failed, or cancelled at its timeout, which continue-on-error doesn't cover). After the
  # gate, whose release-dependencies job keeps them where none are kept yet, in every run but a tag's: so a dry run on a
  # pull request that changes the pins builds from the entry that pull request's pins make.
  dependencies:
    needs: [check, gate]
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 20
    outputs:
      uploaded: ${{ steps.upload.outcome == 'success' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # As compiler.yml's release-dependencies job names it: keep the two in step. The exact key alone: an entry for
      # other pins is no use to this build.
      - name: The cache key
        id: key
        env:
          PINS: ${{ hashFiles('compiler/gradle/verification-metadata.xml', 'compiler/gradle/kotlin-native-dependencies.txt', 'compiler/gradle/pinned-jdk.properties', 'compiler/gradle/wrapper/gradle-wrapper.properties', '.github/scripts/compiler-release-dependencies.sh') }}
        run: echo "key=compiler-release-dependencies-v1-$RUNNER_OS-$RUNNER_ARCH-$PINS" | tee -a "$GITHUB_OUTPUT"
      # The repository variable COMPILER_RELEASE_SKIP_CACHE=true skips it, so build fetches everything: the way out where
      # an entry is no use, until it is deleted (compiler/README.md, "Releasing").
      - if: vars.COMPILER_RELEASE_SKIP_CACHE != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: restore
        with:
          path: ~/release-dependencies
          key: ${{ steps.key.outputs.key }}
      # Stored, not compressed: they are archives and jars already.
      - if: steps.restore.outputs.cache-hit == 'true'
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: compiler-release-dependencies
          path: ~/release-dependencies
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  build:
    needs: [check, gate, dependencies]
    # Whatever the dependencies job's result: its runner can be an entry's, which can hang it until it is cancelled. And
    # so the jobs after build ask for build's success alone, as a job's default success() is false where any job before
    # it, dependencies too, wasn't a success.
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.gate.result == 'success' }}
    # macOS builds every target: macosArm64 only builds there, and Kotlin/Native cross-compiles the others.
    runs-on: macos-latest
    permissions:
      contents: read
      # The size of the dependencies job's artifact, before it is downloaded.
      actions: read
    outputs:
      bundle-sha256: ${{ steps.bundle.outputs.sha256 }}
      npm-name: ${{ steps.npm-name.outputs.name }}
      npm-tarball: ${{ steps.npm.outputs.tarball }}
      npm-sha256: ${{ steps.npm.outputs.sha256 }}
      npm-integrity: ${{ steps.npm.outputs.integrity }}
    env:
      VERSION: ${{ needs.check.outputs.version }}
      PUBLISH: ${{ needs.check.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # On macOS, where build unpacks the dependencies: unpack refuses a zip it must not unpack, and puts nothing anywhere.
      - name: The dependencies' unpack refuses a zip it must not unpack
        if: env.PUBLISH != 'true'
        run: ../.github/scripts/compiler-release-dependencies-test.sh
      # Its size first, as GitHub gives it: download-artifact writes the whole artifact before anything checks it, and
      # the dependencies job's runner, which an entry can take over, chooses what it uploads. One artifact of at most
      # 3 GB, unpack's own limit, or none is downloaded; and that one by its ID, so an artifact put in its place after
      # (by a name's overwrite, with a token that runner kept) isn't. At most 10 digits, so bash's arithmetic can't
      # overflow.
      - name: The release dependencies are of a size to download
        id: size
        if: needs.dependencies.outputs.uploaded == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          found=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=compiler-release-dependencies" -q '.artifacts[] | "\(.id) \(.size_in_bytes)"')
          if [[ "$found" =~ ^([0-9]+)\ ([0-9]{1,10})$ ]] && (( BASH_REMATCH[2] <= 3 * 1024 * 1024 * 1024 )); then
            echo "The release dependencies are artifact ${BASH_REMATCH[1]}, of ${BASH_REMATCH[2]} bytes."
            echo "id=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            found="${found:-none}"
            echo "::warning::The release dependencies aren't one artifact of at most 3 GB (found, as <ID> <bytes>: ${found//$'\n'/, }), so the build fetches every dependency."
          fi
      # The dependencies job's upload, as the zip it is: download-artifact doesn't unzip it, so nothing of it is written
      # until compiler-release-dependencies.sh has checked every name in it.
      - if: steps.size.outputs.id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          artifact-ids: ${{ steps.size.outputs.id }}
          path: ${{ runner.temp }}/release-dependencies
          skip-decompress: true
      - name: The release dependencies, checked by name and unpacked
        if: steps.size.outputs.id != ''
        run: |
          shopt -s nullglob
          zips=("$RUNNER_TEMP"/release-dependencies/*)
          if (( ${#zips[@]} != 1 )); then
            echo "::warning::The release dependencies weren't downloaded as one zip, so the build fetches every dependency."
          # unpack refuses a zip it can't take whole, and takes away what it put in place; should it stop otherwise, so
          # is anything of the zip taken away here, and the build fetches every dependency.
          elif ! ../.github/scripts/compiler-release-dependencies.sh unpack "${zips[0]}"; then
            echo "::warning::Unpacking the release dependencies failed, so nothing of them is used, and the build fetches every dependency."
            rm -rf "$HOME/.gradle/caches/modules-2/files-2.1" "$HOME/.cache/drivine-pinned-toolchain" \
              "$HOME/.cache/drivine-konan-dependencies" "$HOME/.cache/drivine-binaryen"
          fi
          # The zip, unpacked or refused, is of no more use, and as big as what it holds: the build needs the disk.
          rm -rf "$RUNNER_TEMP/release-dependencies"
      # No cache: the JDK and Gradle archives as the dependencies held them, or fetched, and either way checked against
      # their pinned SHA-256s.
      - uses: ./.github/actions/pinned-toolchain
        with: { cache: 'false' }
      - name: Kotlin/Native's dependencies, checked
        run: ../.github/scripts/compiler-konan-dependencies.sh fetch gradle/kotlin-native-dependencies.txt
      # From here Kotlin/Native can't fetch anything itself: every dependency it uses is one fetch put in its way, checked.
      # Its prebuilt comes from Maven Central, through Gradle, which checks it.
      - name: Kotlin/Native can fetch nothing of its own
        run: ../.github/scripts/compiler-konan-dependencies.sh block
      - name: Maven Central doesn't have this version yet
        run: |
          # Only an answer of 200 stops a release. When Maven Central can't be asked, the step goes on: the portal
          # rejects a version it already has.
          status=$(curl -s --retry 3 -o /dev/null -w '%{http_code}' "https://repo1.maven.org/maven2/org/drivine/drivine-cypher-compiler/$VERSION/drivine-cypher-compiler-$VERSION.pom" || true)
          if [[ "$status" == 200 ]]; then
            if [[ "$PUBLISH" == true ]]; then
              echo "::error::Maven Central already has org.drivine:drivine-cypher-compiler:$VERSION, so this run publishes nothing. Tag the next version."
              exit 1
            fi
            echo "::warning::Maven Central already has org.drivine:drivine-cypher-compiler:$VERSION."
          elif [[ "$status" != 404 ]]; then
            echo "::warning::Couldn't ask Maven Central whether it has org.drivine:drivine-cypher-compiler:$VERSION (HTTP $status). Going on: the Central Portal rejects a version it already has."
          fi
      # Unsigned: the job after the gate signs it, so this one never holds a key, and every file it checks is published.
      # Strict: every dependency, fetched or unpacked, has its SHA-256 in gradle/verification-metadata.xml, whatever a
      # gradle.properties says.
      - name: Build the bundle
        run: ./gradlew --no-daemon --dependency-verification strict zipAggregationPublication -Pcompiler.version="$VERSION" -Pcompiler.binaryenMirror="$HOME/.cache/drivine-binaryen"
      - name: Kotlin/Native used only its pinned dependencies
        run: ../.github/scripts/compiler-konan-dependencies.sh check gradle/kotlin-native-dependencies.txt
      - name: Check the bundle
        run: ../.github/scripts/compiler-release-check.sh build/nmcp/zip/publicationAggregated.zip "$VERSION" none release
      # A job output, which no other job of the run can set: publish signs only this bundle, not an artifact of the same
      # name put in its place.
      - name: The bundle's SHA-256
        id: bundle
        run: echo "sha256=$(shasum -a 256 release/publicationAggregated.zip | cut -d' ' -f1)" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compiler-maven-central-${{ env.VERSION }}
          path: compiler/release/publicationAggregated.zip
          if-no-files-found: error
      - name: The npm package's name
        id: npm-name
        run: echo "name=$(grep '^compiler.npmName=' gradle.properties | cut -d= -f2-)" | tee -a "$GITHUB_OUTPUT"
      - name: npm doesn't have this version yet
        env:
          NPM_NAME: ${{ steps.npm-name.outputs.name }}
        run: |
          # npm view prints the version where the registry has it, nothing (and fails) where it hasn't. Where the
          # registry can't be asked, the step goes on: npm publish refuses a version it already has.
          if got=$(npm view "$NPM_NAME@$VERSION" version 2> /dev/null) && [[ "$got" == "$VERSION" ]]; then
            if [[ "$PUBLISH" == true ]]; then
              echo "::warning::npm already has $NPM_NAME@$VERSION; the npm publish job checks it is this run's tarball, and publishes nothing."
            else
              echo "::warning::npm already has $NPM_NAME@$VERSION."
            fi
          fi
      # The wasmJs build, as the gate's corpus check checked it, packed as npm publishes it.
      - name: Build and check the npm package
        id: npm
        env:
          NPM_NAME: ${{ steps.npm-name.outputs.name }}
        run: |
          ./gradlew --no-daemon --dependency-verification strict npmPackage -Pcompiler.version="$VERSION" -Pcompiler.binaryenMirror="$HOME/.cache/drivine-binaryen"
          tarball="$(npm pack ./build/npm --pack-destination release --silent | tail -n 1)"
          ../.github/scripts/compiler-npm-check.sh "release/$tarball" "$VERSION" "$NPM_NAME" | tee -a "$GITHUB_OUTPUT"
          echo "tarball=$tarball" | tee -a "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "release/$tarball" | cut -d' ' -f1)" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compiler-npm-${{ env.VERSION }}
          path: compiler/release/${{ steps.npm.outputs.tarball }}
          if-no-files-found: error

  # Signs build's bundle with the release key and uploads it, as one deployment, followed until the Portal publishes it.
  # It waits in the `release` environment, which holds the secrets, for its reviewer's approval. It needs nothing but the
  # bundle, this commit's scripts, and gpg, curl, jq and zip, which the runner has.
  publish:
    needs: [check, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.check.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    environment: release
    # The upload's poll gives up after an hour; the signing takes a minute.
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Its scripts alone: the job holds the release secrets, and needs no token of the repository's after checkout.
        with: { persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compiler-maven-central-${{ env.VERSION }}
          path: ${{ runner.temp }}/unsigned
      - name: The bundle is build's
        env:
          BUNDLE_SHA256: ${{ needs.build.outputs.bundle-sha256 }}
        run: |
          got=$(shasum -a 256 "$RUNNER_TEMP/unsigned/publicationAggregated.zip" | cut -d' ' -f1)
          if [[ -z "$BUNDLE_SHA256" || "$got" != "$BUNDLE_SHA256" ]]; then
            echo "::error::The bundle downloaded has SHA-256 $got, not ${BUNDLE_SHA256:-none} as build made it."
            exit 1
          fi
      - name: The release secrets are set
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
        run: |
          missing=()
          [[ "$SIGNING_KEY" == *'BEGIN PGP PRIVATE KEY BLOCK'* ]] || missing+=('SIGNING_KEY (an ASCII-armored private key)')
          [[ -n "$SIGNING_PASSWORD" ]] || missing+=(SIGNING_PASSWORD)
          [[ -n "$CENTRAL_PORTAL_USERNAME" ]] || missing+=(CENTRAL_PORTAL_USERNAME)
          [[ -n "$CENTRAL_PORTAL_PASSWORD" ]] || missing+=(CENTRAL_PORTAL_PASSWORD)
          if (( ${#missing[@]} )); then
            echo "::error::The release environment is missing: ${missing[*]}."
            exit 1
          fi
      - name: Sign the bundle
        run: ../.github/scripts/compiler-release-sign.sh "$RUNNER_TEMP/unsigned/publicationAggregated.zip" "$VERSION" "$RUNNER_TEMP/signed.zip" "$RUNNER_TEMP/signed"
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
      - name: Publish to Maven Central
        run: ../.github/scripts/compiler-release-upload.sh "$RUNNER_TEMP/signed.zip"
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
      # Only once published: a bundle a failed step left is not kept.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compiler-maven-central-uploaded-${{ env.VERSION }}
          path: ${{ runner.temp }}/signed.zip
          if-no-files-found: warn

  # Publishes build's npm tarball by npm's trusted publishing: npm is told, in the package's settings, that this
  # repository's compiler-release.yml may publish it from the `release` environment, and GitHub's OIDC token proves that
  # on each run, so no npm token is stored. It also gives npm's provenance (the run and commit that built it). It waits in
  # `release`, as publish does, but needs neither publish nor its secrets: a failure of one doesn't hold up the other. Re-run for the same tag, it publishes nothing where npm has this tarball already, and
  # fails where npm has another under the version.
  publish-npm:
    needs: [check, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.check.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    permissions:
      contents: read
      # npm's trusted publishing and provenance: the OIDC token that proves this workflow and signs where the package came from.
      id-token: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      NPM_NAME: ${{ needs.build.outputs.npm-name }}
      TARBALL: ${{ needs.build.outputs.npm-tarball }}
      INTEGRITY: ${{ needs.build.outputs.npm-integrity }}
    # No checkout: the tarball is all it needs.
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # An exact release of Node 24, the LTS, so a new one reaches the publish only through a reviewed bump.
          node-version: 24.22.2
      - name: Install the pinned npm, checked against its integrity
        run: |
          dir="$RUNNER_TEMP/npm-cli"
          mkdir -p "$dir"
          tgz="$(npm pack "npm@$NPM_CLI_VERSION" --pack-destination "$dir" --ignore-scripts --silent | tail -n 1)"
          got="sha512-$(openssl dgst -sha512 -binary "$dir/$tgz" | base64 | tr -d '\n')"
          if [[ "$got" != "$NPM_CLI_INTEGRITY" ]]; then
            echo "::error::npm $NPM_CLI_VERSION's tarball has integrity $got, not $NPM_CLI_INTEGRITY as pinned."
            exit 1
          fi
          npm install -g "$dir/$tgz" --ignore-scripts
          hash -r
          if [[ "$(npm --version)" != "$NPM_CLI_VERSION" ]]; then
            echo "::error::npm is $(npm --version), not $NPM_CLI_VERSION."
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compiler-npm-${{ env.VERSION }}
          path: ${{ runner.temp }}/npm
      - name: The tarball is build's
        env:
          NPM_SHA256: ${{ needs.build.outputs.npm-sha256 }}
        run: |
          got=$(shasum -a 256 "$RUNNER_TEMP/npm/$TARBALL" | cut -d' ' -f1)
          if [[ -z "$NPM_SHA256" || "$got" != "$NPM_SHA256" ]]; then
            echo "::error::The npm tarball downloaded has SHA-256 $got, not ${NPM_SHA256:-none} as build made it."
            exit 1
          fi
      - name: Publish to npm
        run: |
          # A re-run: npm has the version already. It is this run's tarball, or the publish fails.
          if published=$(npm view "$NPM_NAME@$VERSION" dist.integrity 2> /dev/null) && [[ -n "$published" ]]; then
            if [[ "$published" == "$INTEGRITY" ]]; then
              echo "npm already has $NPM_NAME@$VERSION, this tarball: nothing to publish."
              exit 0
            fi
            echo "::error::npm already has $NPM_NAME@$VERSION, with integrity $published, not this tarball's $INTEGRITY."
            exit 1
          fi
          # npm publishes a version with a suffix (1.2.3-rc.1) only under a tag of its own, never as latest.
          tag=latest
          [[ "$VERSION" == *-* ]] && tag=next
          npm publish "$RUNNER_TEMP/npm/$TARBALL" --ignore-scripts --provenance --access public --tag "$tag"

  # A dry run's stand-in for publish-npm: build's tarball, checked as publish-npm checks it, given to npm publish
  # --dry-run, which packs and reports it but sends nothing and needs no token.
  publish-npm-dry-run:
    needs: [check, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.check.outputs.publish != 'true' }}
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
      TARBALL: ${{ needs.build.outputs.npm-tarball }}
    # No checkout: the tarball is all it needs.
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # An exact release of Node 24, the LTS, so a new one reaches the publish only through a reviewed bump.
          node-version: 24.22.2
      - name: Install the pinned npm, checked against its integrity
        run: |
          dir="$RUNNER_TEMP/npm-cli"
          mkdir -p "$dir"
          tgz="$(npm pack "npm@$NPM_CLI_VERSION" --pack-destination "$dir" --ignore-scripts --silent | tail -n 1)"
          got="sha512-$(openssl dgst -sha512 -binary "$dir/$tgz" | base64 | tr -d '\n')"
          if [[ "$got" != "$NPM_CLI_INTEGRITY" ]]; then
            echo "::error::npm $NPM_CLI_VERSION's tarball has integrity $got, not $NPM_CLI_INTEGRITY as pinned."
            exit 1
          fi
          npm install -g "$dir/$tgz" --ignore-scripts
          hash -r
          if [[ "$(npm --version)" != "$NPM_CLI_VERSION" ]]; then
            echo "::error::npm is $(npm --version), not $NPM_CLI_VERSION."
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compiler-npm-${{ env.VERSION }}
          path: ${{ runner.temp }}/npm
      - name: The tarball is build's
        env:
          NPM_SHA256: ${{ needs.build.outputs.npm-sha256 }}
        run: |
          got=$(shasum -a 256 "$RUNNER_TEMP/npm/$TARBALL" | cut -d' ' -f1)
          if [[ -z "$NPM_SHA256" || "$got" != "$NPM_SHA256" ]]; then
            echo "::error::The npm tarball downloaded has SHA-256 $got, not ${NPM_SHA256:-none} as build made it."
            exit 1
          fi
      - name: Publish to npm, as a dry run
        run: npm publish "$RUNNER_TEMP/npm/$TARBALL" --dry-run --ignore-scripts --access public --tag dry-run

  # A dry run's stand-in for publish, which it skips: build's bundle signed as publish signs it, but with a key made here
  # and thrown away with the runner, with GitHub's release downloads blocked throughout, then checked to be build's bundle
  # with a signature beside each file, uploaded as publish uploads it to a stand-in for the Portal on the runner, and kept
  # as the run's artifact. It uploads nothing to the Portal.
  publish-dry-run:
    needs: [check, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.check.outputs.publish != 'true' }}
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compiler-maven-central-${{ env.VERSION }}
          path: ${{ runner.temp }}/unsigned
      - name: The bundle is build's
        env:
          BUNDLE_SHA256: ${{ needs.build.outputs.bundle-sha256 }}
        run: |
          got=$(shasum -a 256 "$RUNNER_TEMP/unsigned/publicationAggregated.zip" | cut -d' ' -f1)
          if [[ -z "$BUNDLE_SHA256" || "$got" != "$BUNDLE_SHA256" ]]; then
            echo "::error::The bundle downloaded has SHA-256 $got, not ${BUNDLE_SHA256:-none} as build made it."
            exit 1
          fi
      - name: Block GitHub's release downloads and Adoptium's API
        run: |
          for host in objects.githubusercontent.com release-assets.githubusercontent.com api.adoptium.net api.foojay.io; do
            printf '0.0.0.0 %s\n:: %s\n' "$host" "$host" | sudo tee -a /etc/hosts > /dev/null
          done
          if curl -s --max-time 10 -o /dev/null https://api.adoptium.net; then
            echo "::error::api.adoptium.net is still reachable, so this job shows nothing."
            exit 1
          fi
      - name: Make a throwaway signing key
        run: |
          export GNUPGHOME="$RUNNER_TEMP/dry-run-gnupg"
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --pinentry-mode loopback --passphrase dry-run \
            --quick-gen-key 'Drivine release dry run <dry-run@invalid>' rsa3072 sign 1d
          gpg --batch --pinentry-mode loopback --passphrase dry-run --armor --export-secret-keys > "$RUNNER_TEMP/dry-run-key.asc"
          gpgconf --kill gpg-agent
      - name: Sign the bundle as publish does
        run: |
          SIGNING_KEY="$(cat "$RUNNER_TEMP/dry-run-key.asc")" \
            ../.github/scripts/compiler-release-sign.sh "$RUNNER_TEMP/unsigned/publicationAggregated.zip" "$VERSION" "$RUNNER_TEMP/signed.zip" "$RUNNER_TEMP/signed"
        env:
          SIGNING_PASSWORD: dry-run
      # On Linux, whose unzip makes the links a zip holds: a bundle with a link among thousands, a file, a version or a path
      # no artifact's publication makes is refused, and leaves no signed bundle.
      - name: The sign script refuses a bundle it must not sign
        run: |
          SIGNING_KEY="$(cat "$RUNNER_TEMP/dry-run-key.asc")" \
            ../.github/scripts/compiler-release-sign-test.sh "$RUNNER_TEMP/unsigned/publicationAggregated.zip" "$VERSION"
        env:
          SIGNING_PASSWORD: dry-run
      # The signed bundle is build's, file for file and byte for byte, with a signature beside each file.
      - name: The signed bundle is build's, signed
        run: |
          mkdir "$RUNNER_TEMP/a" "$RUNNER_TEMP/b"
          unzip -q "$RUNNER_TEMP/unsigned/publicationAggregated.zip" -d "$RUNNER_TEMP/a"
          unzip -q "$RUNNER_TEMP/signed.zip" -d "$RUNNER_TEMP/b"
          signatures=$(find "$RUNNER_TEMP/b" -name '*.asc' | wc -l)
          find "$RUNNER_TEMP/b" -name '*.asc' -delete
          if ! diff -r "$RUNNER_TEMP/a" "$RUNNER_TEMP/b"; then
            echo "::error::The signed bundle isn't build's bundle with signatures beside it."
            exit 1
          fi
          echo "The signed bundle is build's, with $signatures signatures."
      # The upload as publish makes it, to a stand-in for the Central Portal on this runner. It refuses an upload that
      # isn't nmcp's (the token's header, AUTOMATIC, the bundle's field, filename and type, the signed bundle's bytes),
      # then answers the status as the Portal does, and fails a status request for anything but that deployment's id.
      - name: Upload the bundle as publish does, to a stand-in Portal
        run: |
          python3 -I - "$RUNNER_TEMP/signed.zip" <<'EOF' &
          import base64, http.server, json, sys
          bundle = open(sys.argv[1], "rb").read()
          token = "UserToken " + base64.b64encode(b"dry-run:dry-run").decode()
          class Portal(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  body = self.rfile.read(int(self.headers.get("Content-Length") or 0))
                  upload = self.path.split("?")[0] == "/upload"
                  ok = self.headers.get("Authorization") == token and (
                      self.path == "/upload?publishingType=AUTOMATIC"
                      and b'name="bundle"; filename="publicationAggregated.zip"\r\nContent-Type: application/zip\r\n' in body
                      and bundle in body if upload else self.path == "/status?id=0f0e1d2c-0000-4000-8000-00000000d0d0")
                  self.send_response((201 if upload else 200) if ok or not upload else 400)
                  self.end_headers()
                  if not ok and upload:
                      self.wfile.write(b"Not the upload nmcp makes.")
                  elif upload:
                      self.wfile.write(b"0f0e1d2c-0000-4000-8000-00000000d0d0")
                  else:
                      self.wfile.write(json.dumps({"deploymentState": "PUBLISHED"} if ok else
                          {"deploymentState": "FAILED", "errors": ["Not the Portal's status request."]}).encode())
          http.server.HTTPServer(("127.0.0.1", 18080), Portal).serve_forever()
          EOF
          for _ in $(seq 1 20); do curl -s -o /dev/null http://127.0.0.1:18080/ && break; sleep 1; done
          ../.github/scripts/compiler-release-upload.sh "$RUNNER_TEMP/signed.zip"
        env:
          CENTRAL_PORTAL_URL: http://127.0.0.1:18080
          CENTRAL_PORTAL_USERNAME: dry-run
          CENTRAL_PORTAL_PASSWORD: dry-run
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compiler-maven-central-signed-${{ env.VERSION }}
          path: ${{ runner.temp }}/signed.zip
          if-no-files-found: error
