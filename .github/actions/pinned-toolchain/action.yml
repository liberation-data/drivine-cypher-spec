# Installs the JDK gradle/pinned-jdk.properties pins and the Gradle distribution gradle-wrapper.properties names, each from
# the archive its project publishes, checked against the SHA-256 pinned beside it. Adoptium and services.gradle.org serve
# those archives as GitHub release assets, whose outages failed v0.31.0's release: so the archives are kept, and only
# fetched where none is kept, with retries.
#
# - Without `artifact`: from this repository's Actions cache, keyed on both checksums. A run reads the caches of its own
#   ref and of main, so main's runs keep them for pull requests and tags; after a pin moves, the first run on main fetches
#   them. Where nothing is cached, they are fetched, and a run that can't fetch them fails naming the URL.
# - With `artifact`: from that artifact of this run, as compiler-release.yml's build job keeps them for the jobs after its
#   gate, which then fetch nothing.
#
# Either way an archive whose SHA-256 isn't the pinned one is refused, so a cache or an artifact can't bring another JDK.
name: The pinned JDK and Gradle
description: Installs the pinned Temurin and Gradle distribution from their checked archives, kept in the cache or an artifact.
inputs:
  artifact:
    description: The name of an artifact of this run holding the archives, in place of the cache and a fetch.
    default: ''
outputs:
  dir:
    description: The folder holding the two checked archives, to keep as an artifact.
    value: ${{ steps.pins.outputs.dir }}
runs:
  using: composite
  steps:
    - name: The pins
      id: pins
      shell: bash
      run: |
        props=compiler/gradle/pinned-jdk.properties
        wrapper=compiler/gradle/wrapper/gradle-wrapper.properties
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64) platform=linux-x64 ;; Linux-ARM64) platform=linux-aarch64 ;;
          macOS-ARM64) platform=mac-aarch64 ;; Windows-X64) platform=windows-x64 ;;
          *) echo "::error::No JDK is pinned for $RUNNER_OS-$RUNNER_ARCH in $props."; exit 1 ;;
        esac
        os=${platform%-*} arch=${platform#*-}
        version=$(sed -n 's/^version=//p' "$props")
        jdk_sha=$(sed -n "s/^sha256\.$platform=//p" "$props")
        gradle_url=$(sed -n 's/^distributionUrl=//p' "$wrapper" | sed 's/\\:/:/g')
        gradle_sha=$(sed -n 's/^distributionSha256Sum=//p' "$wrapper")
        [[ -n "$version" && -n "$jdk_sha" ]] || { echo "::error::$props pins no JDK for $platform."; exit 1; }
        [[ -n "$gradle_url" && -n "$gradle_sha" ]] || { echo "::error::$wrapper has no distributionUrl and distributionSha256Sum."; exit 1; }
        dir="$HOME/.cache/drivine-pinned-toolchain"
        mkdir -p "$dir"
        {
          echo "version=$version"
          echo "jdk_url=https://api.adoptium.net/v3/binary/version/jdk-${version//+/%2B}/$os/$arch/jdk/hotspot/normal/eclipse"
          echo "jdk_sha=$jdk_sha"
          echo "jdk_file=$dir/temurin-$version-$platform.$([[ $os == windows ]] && echo zip || echo tar.gz)"
          echo "gradle_url=$gradle_url"
          echo "gradle_sha=$gradle_sha"
          echo "gradle_file=$dir/${gradle_url##*/}"
          echo "dir=$dir"
        } >> "$GITHUB_OUTPUT"
    - if: inputs.artifact == ''
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.pins.outputs.dir }}
        key: pinned-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.jdk_sha }}-${{ steps.pins.outputs.gradle_sha }}
    - if: inputs.artifact != ''
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.artifact }}
        path: ${{ steps.pins.outputs.dir }}
    - name: The archives, checked
      shell: bash
      env:
        FETCH: ${{ inputs.artifact == '' }}
        JDK_URL: ${{ steps.pins.outputs.jdk_url }}
        JDK_SHA: ${{ steps.pins.outputs.jdk_sha }}
        JDK_FILE: ${{ steps.pins.outputs.jdk_file }}
        GRADLE_URL: ${{ steps.pins.outputs.gradle_url }}
        GRADLE_SHA: ${{ steps.pins.outputs.gradle_sha }}
        GRADLE_FILE: ${{ steps.pins.outputs.gradle_file }}
      run: |
        sha() { shasum -a 256 "$1" | cut -d' ' -f1; }
        # Each archive as kept, or where none is kept (or not this one), fetched: with retries over a few minutes, as
        # GitHub's release downloads fail on and off in an outage.
        get() {
          local url="$1" want="$2" file="$3"
          [[ -f "$file" && "$(sha "$file")" == "$want" ]] && { echo "$(basename "$file"): kept, SHA-256 $want."; return; }
          if [[ "$FETCH" != true ]]; then
            echo "::error::The artifact holds no $(basename "$file") with SHA-256 $want."
            exit 1
          fi
          rm -f "$file"
          if ! curl -fsSL --retry 8 --retry-all-errors --retry-delay 20 --connect-timeout 20 --max-time 600 -o "$file" "$url"; then
            echo "::error::Couldn't fetch $url, nor was $(basename "$file") cached. It is served from GitHub's release downloads: re-run this job once those work."
            exit 1
          fi
          local got; got=$(sha "$file")
          if [[ "$got" != "$want" ]]; then
            rm -f "$file"
            echo "::error::$url has SHA-256 $got, not $want as pinned."
            exit 1
          fi
          echo "$(basename "$file"): fetched, SHA-256 $want."
        }
        get "$JDK_URL" "$JDK_SHA" "$JDK_FILE"
        get "$GRADLE_URL" "$GRADLE_SHA" "$GRADLE_FILE"
        # Where ./gradlew looks for the distribution it would fetch: wrapper/dists/<name>/<base 36 of the MD5 of its URL>.
        # The wrapper checks the zip against distributionSha256Sum again, and unpacks it.
        hash=$(python3 -c 'import hashlib,sys; n=int.from_bytes(hashlib.md5(sys.argv[1].encode()).digest(),"big"); d="0123456789abcdefghijklmnopqrstuvwxyz"; s=""
        while n: n,r=divmod(n,36); s=d[r]+s
        print(s)' "$GRADLE_URL")
        name=$(basename "$GRADLE_FILE" .zip)
        mkdir -p "$HOME/.gradle/wrapper/dists/$name/$hash"
        cp "$GRADLE_FILE" "$HOME/.gradle/wrapper/dists/$name/$hash/"
    - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: jdkfile
        jdkFile: ${{ steps.pins.outputs.jdk_file }}
        java-version: ${{ steps.pins.outputs.version }}
    - name: The JDK is the pinned one
      shell: bash
      env:
        PINNED: ${{ steps.pins.outputs.version }}
      run: |
        settings=$("$JAVA_HOME/bin/java" -XshowSettings:properties -version 2>&1)
        runtime=$(sed -n 's/^ *java\.runtime\.version = //p' <<< "$settings")
        vendor=$(sed -n 's/^ *java\.vendor = //p' <<< "$settings")
        if [[ "$runtime" != "$PINNED"* || "$vendor" != *Adoptium* ]]; then
          echo "::error::The JDK installed is $vendor $runtime, not Temurin $PINNED as compiler/gradle/pinned-jdk.properties pins."
          exit 1
        fi
        echo "Temurin $runtime."
