# Within a 7 GB CI runner (macOS, arm64): Kotlin/Native compiles in Gradle's own JVM, the JVM and wasm targets in Kotlin's daemon.
org.gradle.jvmargs=-Xmx4g
kotlin.daemon.jvmargs=-Xmx3g
# Gradle retries a fetch of a dependency (its POM, module or file) that fails with a server error (5xx), a timeout or a
# dropped connection, by default 3 times in all, from 1 s. These ride out about 4 minutes of an outage, as of GitHub's
# release downloads, to which Maven Central redirects some of Kotlin's artifacts: 8 times, from 2 s, doubling. They are
# Gradle's internal names (ErrorHandlingModuleComponentRepository): a bump of Gradle checks they are still read
# (compiler/README.md, "Releasing").
systemProp.org.gradle.internal.repository.max.tentatives=8
systemProp.org.gradle.internal.repository.initial.backoff=2000
# The npm package's name, as the release publishes it: in @liberation-data, the scope Drivine for TypeScript publishes in.
compiler.npmName=@liberation-data/drivine-cypher-compiler
# The SQLite extension's cinterop (native/sqlite3ext.def) is of the same headers on every native target, so nativeMain,
# where the extension is, sees one commonized set of its declarations.
kotlin.mpp.enableCInteropCommonization=true
