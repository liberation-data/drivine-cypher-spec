# Values a CREATE or a MERGE writes: each position a write takes a value in, by each form of value, and what Neo4j
# 2026.10.1 does with it (liberation-data/drivine4j#814, #817). See README.md, "Values a write makes".
graph: "CREATE (a:CyWrite {id: 'a'})-[:NEXT]->(b:CyWrite {id: 'b'})-[:NEXT]->(:CyWrite {id: 'c'}), (a)-[:NEXT]->(:CyWrite {id: 'd'})"
positions:
  - {name: "CREATE, a node made alone", made: "a", cypher: "MATCH (n:CyWrite) CREATE (a:CyNew {name: 'x'}), (m:CyMade {f: {value}}) RETURN [n.id, m.f] ORDER BY n.id"}
  - {name: "CREATE, a relationship's endpoint", made: "a", cypher: "MATCH (n:CyWrite) CREATE (a:CyNew {name: 'x'})-[:CyR]->(m:CyMade {f: {value}}) RETURN [n.id, m.f] ORDER BY n.id"}
  - {name: "CREATE, a relationship", made: "a", cypher: "MATCH (n:CyWrite) CREATE (a:CyNew {name: 'x'})-[r:CyR {f: {value}}]->(m:CyMade) RETURN [n.id, r.f] ORDER BY n.id"}
  - {name: "FOREACH CREATE, a node made alone", made: "a", cypher: "MATCH (n:CyWrite) FOREACH (i IN [1] | CREATE (a:CyNew {name: 'x'}), (m:CyMade {f: {value}})) WITH count(*) AS c MATCH (m:CyMade) RETURN m.f ORDER BY m.f"}
  - {name: "FOREACH CREATE, a relationship's endpoint", made: "a", cypher: "MATCH (n:CyWrite) FOREACH (i IN [1] | CREATE (a:CyNew {name: 'x'})-[:CyR]->(m:CyMade {f: {value}})) WITH count(*) AS c MATCH (m:CyMade) RETURN m.f ORDER BY m.f"}
  - {name: "FOREACH CREATE, a relationship", made: "a", cypher: "MATCH (n:CyWrite) FOREACH (i IN [1] | CREATE (a:CyNew {name: 'x'})-[r:CyR {f: {value}}]->(m:CyMade)) WITH count(*) AS c MATCH ()-[r:CyR]->() RETURN r.f ORDER BY r.f"}
  - {name: "MERGE, a node made alone", made: "m", cypher: "MATCH (n:CyWrite) MERGE (m:CyMade {f: {value}}) RETURN [n.id, m.f] ORDER BY n.id"}
  - {name: "MERGE, a relationship's endpoint", made: "a", cypher: "MATCH (n:CyWrite) MERGE (a:CyNew {name: 'x'})-[:CyR]->(m:CyMade {f: {value}}) RETURN [n.id, m.f] ORDER BY n.id"}
  - {name: "MERGE, a relationship", made: "a", cypher: "MATCH (n:CyWrite) MERGE (a:CyNew {name: 'x'})-[r:CyR {f: {value}}]->(m:CyMade) RETURN [n.id, r.f] ORDER BY n.id"}
  - {name: "FOREACH MERGE, a node made alone", made: "m", cypher: "MATCH (n:CyWrite) FOREACH (i IN [1] | MERGE (m:CyMade {f: {value}})) WITH count(*) AS c MATCH (m:CyMade) RETURN m.f ORDER BY m.f"}
  - {name: "FOREACH MERGE, a relationship's endpoint", made: "a", cypher: "MATCH (n:CyWrite) FOREACH (i IN [1] | MERGE (a:CyNew {name: 'x'})-[:CyR]->(m:CyMade {f: {value}})) WITH count(*) AS c MATCH (m:CyMade) RETURN m.f ORDER BY m.f"}
  - {name: "FOREACH MERGE, a relationship", made: "a", cypher: "MATCH (n:CyWrite) FOREACH (i IN [1] | MERGE (a:CyNew {name: 'x'})-[r:CyR {f: {value}}]->(m:CyMade)) WITH count(*) AS c MATCH ()-[r:CyR]->() RETURN r.f ORDER BY r.f"}
  - {name: "MERGE, ON CREATE SET", made: "m", cypher: "MATCH (n:CyWrite) MERGE (m:CyMade {id: n.id}) ON CREATE SET m.f = {value} RETURN [n.id, m.f] ORDER BY n.id"}
  - {name: "MERGE, ON MATCH SET", made: "m", cypher: "MATCH (n:CyWrite) MERGE (m:CyWrite {id: n.id}) ON MATCH SET m.f = {value} RETURN [n.id, m.f] ORDER BY n.id"}
forms:
  - {name: "a pattern naming a variable bound before", value: "NOT (n)-[:NEXT]->()"}
  - {name: "a pattern of new variables only", value: "NOT ()-[:NEXT]->()"}
  - {name: "a pattern comprehension naming a variable bound before", value: "size([(n)-[:NEXT]->(x) | x])"}
  - {name: "EXISTS naming a variable bound before", value: "EXISTS { (n)-[:NEXT]->() }"}
  - {name: "COUNT naming a variable bound before", value: "COUNT { (n)-[:NEXT]->() }"}
  - {name: "a variable the clause makes, bare", value: "{made}"}
  - {name: "a property of a variable the clause makes", value: "{made}.name"}
  - {name: "a pattern naming a variable the clause makes", value: "NOT ({made})-[:NEXT]->()"}
  - {name: "EXISTS naming a variable the clause makes", value: "EXISTS { ({made})-[:NEXT]->() }"}
  - {name: "a pattern comprehension naming a variable the clause makes", value: "size([({made})-[:NEXT]->(x) | x])"}
  - {name: "a variable bound before, plainly", value: "n.id"}
