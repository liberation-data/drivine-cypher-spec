# What each library's own code does with the values compiled SQL hands it: the functions it registers on SQLite, which the SQL
# calls, and how it reads a column of a statement's rows. Read with no store: on an in-memory SQLite and pure functions. Each
# case pairs its steps with the store cases whose compiled statements rely on them. See README.md.

cases:
  - name: "drivine_equal"
    description: "drivine_equal(a, b) compares two JSON values as Cypher does: 1 or 0, or null where either is no value or a null in them decides. NaN, as SQLite's JSON writes it, is equal to nothing, itself included, in a list or a map too; an infinity, as SQLite's JSON writes it, is equal to itself. A map that is not exactly the tag of NaN is a map. A temporal value's tag is equal to another only where it is the same value, its kind, text and key: two moments at one instant and two offsets are not, nor a date and the text that spells it."
    pairs:
      writes.yaml: ["NaN worked out from stored infinities"]
      queries.yaml: ["NaN and the infinities as parameters"]
      temporal.yaml: ["Zoned values at one instant", "A date and the text that spells it"]
    steps:
      - function: "drivine_equal"
        args: ['{"$numberDouble":"NaN"}', '{"$numberDouble":"NaN"}']
        result: 0
      - function: "drivine_equal"
        args: ['{"$numberDouble":"NaN"}', '1.0']
        result: 0
      - function: "drivine_equal"
        args: ['[1.0,{"$numberDouble":"NaN"}]', '[1.0,{"$numberDouble":"NaN"}]']
        result: 0
      - function: "drivine_equal"
        args: ['{"x":{"$numberDouble":"NaN"}}', '{"x":{"$numberDouble":"NaN"}}']
        result: 0
      - note: "The pair with NaN is false, which decides before the pair with null."
        function: "drivine_equal"
        args: ['[{"$numberDouble":"NaN"},null]', '[{"$numberDouble":"NaN"},null]']
        result: 0
      - function: "drivine_equal"
        args: ['[1,null]', '[1,null]']
        result: null
      - function: "drivine_equal"
        args: ['{"$numberDouble":"NaN"}', '"NaN"']
        result: 0
      - function: "drivine_equal"
        args: ['9e999', '9e999']
        result: 1
      - function: "drivine_equal"
        args: ['9e999', '-9e999']
        result: 0
      - function: "drivine_equal"
        args: ['9e999', '1e308']
        result: 0
      - function: "drivine_equal"
        args: ['1', '1.0']
        result: 1
      - note: "Not the tag: another text than NaN."
        function: "drivine_equal"
        args: ['{"$numberDouble":"2.0"}', '{"$numberDouble":"2.0"}']
        result: 1
      - note: "Not the tag: another key beside it."
        function: "drivine_equal"
        args: ['{"$numberDouble":"NaN","x":1}', '{"x":1,"$numberDouble":"NaN"}']
        result: 1
      - function: "drivine_equal"
        args: [null, '1']
        result: null
      - function: "drivine_equal"
        args: ['null', '1']
        result: null
      - note: "The same value."
        function: "drivine_equal"
        args: ['{"$t":"datetime","v":"2024-01-01T10:00:00+02:00","s":"10000020240101080000000000000072000"}', '{"$t":"datetime","v":"2024-01-01T10:00:00+02:00","s":"10000020240101080000000000000072000"}']
        result: 1
      - note: "The same instant at another offset, as Neo4j has it."
        function: "drivine_equal"
        args: ['{"$t":"datetime","v":"2024-01-01T10:00:00+02:00","s":"10000020240101080000000000000072000"}', '{"$t":"datetime","v":"2024-01-01T08:00:00Z","s":"10000020240101080000000000000064800"}']
        result: 0
      - note: "A date and the text that spells it."
        function: "drivine_equal"
        args: ['{"$t":"date","v":"2024-01-01","s":"10000020240101"}', '"2024-01-01"']
        result: 0
      - function: "drivine_equal"
        args: ['[{"$t":"date","v":"2024-01-01","s":"10000020240101"}]', '[{"$t":"date","v":"2024-01-01","s":"10000020240101"}]']
        result: 1
      - note: "Durations of the same length, as Neo4j has them."
        function: "drivine_equal"
        args: ['{"$t":"duration","v":"P1D"}', '{"$t":"duration","v":"PT24H"}']
        result: 0

  - name: "drivine_add"
    description: "drivine_add(a, b) is Cypher's a + b of two JSON values, as JSON text: NaN, as SQLite's JSON writes it, adds as a number, a sum of floats past a double's range is an infinity, written 9e999, and infinities of both signs sum to NaN; a text put together with NaN or an infinity writes it as Java does. Null where Cypher adds no such two, a map that is not exactly the tag of NaN among them."
    pairs:
      writes.yaml: ["NaN worked out from stored infinities", "NaN and the infinities written"]
    steps:
      - function: "drivine_add"
        args: ['{"$numberDouble":"NaN"}', '1']
        result: '{"$numberDouble":"NaN"}'
      - function: "drivine_add"
        args: ['1.5', '{"$numberDouble":"NaN"}']
        result: '{"$numberDouble":"NaN"}'
      - function: "drivine_add"
        args: ['9e999', '-9e999']
        result: '{"$numberDouble":"NaN"}'
      - function: "drivine_add"
        args: ['9e999', '1']
        result: '9e999'
      - function: "drivine_add"
        args: ['1e308', '1e308']
        result: '9e999'
      - function: "drivine_add"
        args: ['-1e308', '-1e308']
        result: '-9e999'
      - function: "drivine_add"
        args: ['"a"', '{"$numberDouble":"NaN"}']
        result: '"aNaN"'
      - function: "drivine_add"
        args: ['{"$numberDouble":"NaN"}', '"a"']
        result: '"NaNa"'
      - function: "drivine_add"
        args: ['"a"', '9e999']
        result: '"aInfinity"'
      - function: "drivine_add"
        args: ['[1]', '{"$numberDouble":"NaN"}']
        result: '[1,{"$numberDouble":"NaN"}]'
      - function: "drivine_add"
        args: ['1', '2']
        result: '3'
      - function: "drivine_add"
        args: ['1', '2.5']
        result: '3.5'
      - note: "Not the tag: a map, which is added to no number."
        function: "drivine_add"
        args: ['{"$numberDouble":"2.0"}', '1']
        result: null
      - note: "Not the tag: another key beside it."
        function: "drivine_add"
        args: ['{"$numberDouble":"NaN","x":1}', '1']
        result: null
      - function: "drivine_add"
        args: [null, '1']
        result: null

  - name: "drivine_list_order"
    description: "drivine_list_order(a, b) is where the JSON list a comes beside the JSON list b in a comparison (<, >= …): -1, 0 or 1, by the first pair of items not equal, or by their sizes; null where either is no list, or where the pair that decides is not ordered, as a pair with NaN is not. An infinity is ordered as the float it is. Two temporal values' tags of one kind, not durations, are ordered by their sort keys s; tags of two kinds, two durations, and a tag beside any other value are not ordered."
    pairs:
      temporal.yaml: ["A temporal list beside a text list"]
      writes.yaml: ["NaN worked out from stored infinities"]
      queries.yaml: ["NaN and the infinities as parameters"]
    steps:
      - function: "drivine_list_order"
        args: ['[{"$numberDouble":"NaN"},1]', '[{"$numberDouble":"NaN"},2]']
        result: null
      - function: "drivine_list_order"
        args: ['[{"$numberDouble":"NaN"}]', '[{"$numberDouble":"NaN"}]']
        result: null
      - function: "drivine_list_order"
        args: ['[1,{"$numberDouble":"NaN"}]', '[2,{"$numberDouble":"NaN"}]']
        result: -1
      - function: "drivine_list_order"
        args: ['[9e999]', '[1e308]']
        result: 1
      - function: "drivine_list_order"
        args: ['[-9e999]', '[9e999]']
        result: -1
      - function: "drivine_list_order"
        args: ['[1]', '[1,2]']
        result: -1
      - note: "Not the tag: two maps, equal."
        function: "drivine_list_order"
        args: ['[{"$numberDouble":"2.0"}]', '[{"$numberDouble":"2.0"}]']
        result: 0
      - function: "drivine_list_order"
        args: ['1', '[1]']
        result: null
      - note: "Tags of a kind by their sort keys."
        function: "drivine_list_order"
        args: ['[{"$t":"date","v":"2024-01-01","s":"10000020240101"}]', '[{"$t":"date","v":"2024-01-02","s":"10000020240102"}]']
        result: -1
      - note: "A zoned value by its instant, whatever its offset."
        function: "drivine_list_order"
        args: ['[{"$t":"datetime","v":"2024-01-01T10:00:00+02:00","s":"10000020240101080000000000000072000"}]', '[{"$t":"datetime","v":"2024-01-01T09:00:00Z","s":"10000020240101090000000000000064800"}]']
        result: -1
      - note: "Tags of two kinds are not ordered."
        function: "drivine_list_order"
        args: ['[{"$t":"date","v":"2024-01-01","s":"10000020240101"}]', '[{"$t":"localdatetime","v":"2024-01-02T00:00:00","s":"10000020240102000000000000000"}]']
        result: null
      - note: "Nor are durations."
        function: "drivine_list_order"
        args: ['[{"$t":"duration","v":"P1D"}]', '[{"$t":"duration","v":"P2D"}]']
        result: null
      - note: "Nor a tag and a text."
        function: "drivine_list_order"
        args: ['[{"$t":"date","v":"2024-01-01","s":"10000020240101"}]', '["2024-01-02"]']
        result: null

  - name: "drivine_sort_key"
    description: "drivine_sort_key(list) is a text that orders, as SQLite orders text, as Cypher orders the JSON list: item by item, a list that another begins with first, and items of different kinds as Cypher orders kinds, a map, a list, a temporal value's tag, a text, a truth value, a number, then null, tags by their kinds in Cypher's order and within a kind by their sort keys s. NaN, as SQLite's JSON writes it, is a number, after every other, an infinity's too. A map that is not exactly the tag of NaN is a map. The text itself is each library's own: only its order is pinned. Of a value that is no list, it is the JSON text given; of null, null."
    pairs:
      writes.yaml: ["NaN worked out from stored infinities"]
      queries.yaml: ["NaN and the infinities as parameters"]
    steps:
      - function: "drivine_sort_key"
        ascending:
          - '[]'
          - '[{"$numberDouble":"2.0"}]'
          - '[{"$numberDouble":"NaN","x":1}]'
          - '[[1]]'
          - '["a"]'
          - '[true]'
          - '[-9e999]'
          - '[-2.5]'
          - '[1.0]'
          - '[1.0,{"$numberDouble":"NaN"}]'
          - '[1.5]'
          - '[9e999]'
          - '[{"$numberDouble":"NaN"}]'
          - '[null]'
      - function: "drivine_sort_key"
        args: ['{"$numberDouble":"NaN"}']
        result: '{"$numberDouble":"NaN"}'
      - function: "drivine_sort_key"
        args: ['1.5']
        result: '1.5'
      - function: "drivine_sort_key"
        args: [null]
        result: null
      - note: "Temporal values' tags after lists and before texts, by their kinds in Cypher's order, datetime, localdatetime, date, time, localtime, then duration, and within a kind by their sort keys: a zoned value by its instant, then its offset."
        function: "drivine_sort_key"
        ascending:
          - '[{}]'
          - '[[1]]'
          - '[{"$t":"datetime","v":"2024-01-01T09:00:00+02:00","s":"10000020240101070000000000000072000"}]'
          - '[{"$t":"datetime","v":"2024-01-01T08:00:00Z","s":"10000020240101080000000000000064800"}]'
          - '[{"$t":"datetime","v":"2024-01-01T10:00:00+02:00","s":"10000020240101080000000000000072000"}]'
          - '[{"$t":"localdatetime","v":"2024-01-01T00:00:00","s":"10000020240101000000000000000"}]'
          - '[{"$t":"date","v":"-0044-03-15","s":"09999999560315"}]'
          - '[{"$t":"date","v":"2024-01-01","s":"10000020240101"}]'
          - '[{"$t":"date","v":"2024-01-01","s":"10000020240101"},1]'
          - '[{"$t":"time","v":"01:00:00+02:00","s":"061200000000000072000"}]'
          - '[{"$t":"time","v":"22:00:00Z","s":"144000000000000064800"}]'
          - '[{"$t":"localtime","v":"10:00:00","s":"36000000000000"}]'
          - '[{"$t":"duration","v":"P1D"}]'
          - '["a"]'

  - name: "drivine_round"
    description: "drivine_round(number, precision, mode) rounds a SQL number to as many decimal places by the rounding mode, in decimal, as Neo4j's round(value, precision, mode) does; an infinity, which SQLite stores, is itself. Null where the number or the precision is."
    pairs:
      writes.yaml: ["NaN worked out from stored infinities"]
    steps:
      - function: "drivine_round"
        args: [{$float: "Infinity"}, 2, "HALF_DOWN"]
        result: {$float: "Infinity"}
      - function: "drivine_round"
        args: [{$float: "-Infinity"}, 0, "UP"]
        result: {$float: "-Infinity"}
      - note: "Halfway in decimal, where SQLite's binary arithmetic finds it just below."
        function: "drivine_round"
        args: [2.345, 2, "HALF_UP"]
        result: 2.35
      - function: "drivine_round"
        args: [2.5, 0, "HALF_EVEN"]
        result: 2.0
      - function: "drivine_round"
        args: [5, 1, "UP"]
        result: 5.0
      - function: "drivine_round"
        args: [null, 2, "UP"]
        result: null
      - function: "drivine_round"
        args: [2.5, null, "UP"]
        result: null

  - name: "drivine_float_text"
    description: "drivine_float_text(real) is the text of a SQL float as Java writes a double, as toString() gives it: an infinity, which SQLite stores, as Infinity or -Infinity. Null of null."
    pairs:
      writes.yaml: ["NaN worked out from stored infinities"]
      queries.yaml: ["NaN and the infinities as parameters"]
    steps:
      - function: "drivine_float_text"
        args: [{$float: "Infinity"}]
        result: "Infinity"
      - function: "drivine_float_text"
        args: [{$float: "-Infinity"}]
        result: "-Infinity"
      - function: "drivine_float_text"
        args: [null]
        result: null

  - name: "regexp"
    description: "regexp(pattern, text), which SQLite calls for its operator text REGEXP pattern, the pattern first, is 1 where the pattern, a regular expression as Java writes one, matches somewhere in the text, and 0 where it matches nowhere; null where either is null. Compiled SQL's patterns are written only with what every library's regular expressions read alike, and these steps pin it: ^ is the text's start and \\z its end, not before a line break that ends it; a class is written out, with \\t, \\n, \\f, \\r, \\xNN and \\uNNNN and ranges of them; [0-9] is ASCII's digits alone; a backslash makes a character of the syntax itself; groups, (?:\u2026), alternatives, ?, * and + and {m,n} repeat as Java's do; and a leading (?i) in =~'s group, (?:(?i)\u2026), matches ASCII's letters in either case. What the hosts read otherwise, compiled SQL does not lean on: see README.md."
    pairs:
      queries.yaml: ["toFloat() of a text, as Neo4j reads it", "Regular expressions and more functions"]
      temporal.yaml: ["Comparing moments", "Offset without a colon"]
    steps:
      - note: "The pattern first, then the text."
        function: "regexp"
        args: ['b', 'abc']
        result: 1
      - function: "regexp"
        args: ['abc', 'b']
        result: 0
      - function: "regexp"
        args: [null, 'a']
        result: null
      - function: "regexp"
        args: ['a', null]
        result: null
      - note: "^ is the text's start, not a line's."
        function: "regexp"
        args: ['^b', "a\nb"]
        result: 0
      - note: "\\z is the text's end."
        function: "regexp"
        args: ['^a\z', 'a']
        result: 1
      - note: "Not before a line break that ends the text, where Java's $ matches."
        function: "regexp"
        args: ['^a\z', "a\n"]
        result: 0
      - function: "regexp"
        args: ['^a\z', "a\r\n"]
        result: 0
      - function: "regexp"
        args: ['^a\z', "a\u2028"]
        result: 0
      - function: "regexp"
        args: ['^a\z', 'ab']
        result: 0
      - note: "=~'s group around a user's pattern: the whole of the text matches one of its alternatives."
        function: "regexp"
        args: ['^(?:a|bc)\z', 'bc']
        result: 1
      - function: "regexp"
        args: ['^(?:a|bc)\z', 'abc']
        result: 0
      - note: "A leading (?i) in it matches in either case."
        function: "regexp"
        args: ['^(?:(?i)keanu)\z', 'Keanu']
        result: 1
      - function: "regexp"
        args: ['^(?:(?i)kea)\z', 'Keanu']
        result: 0
      - function: "regexp"
        args: ['^(?:(?i)[ck].*)\z', 'Carrie']
        result: 1
      - note: "ASCII's spaces, by their escapes, and no other."
        function: "regexp"
        args: ['^[\t\n\x0B\f\r ]*1[\t\n\x0B\f\r ]*\z', "\t\n\x0b\f\r 1 \r\n"]
        result: 1
      - function: "regexp"
        args: ['^[\t\n\x0B\f\r ]*1\z', "\u00a01"]
        result: 0
      - function: "regexp"
        args: ['^[\t\n\x0B\f\r ]*1\z', "\x1c1"]
        result: 0
      - note: "A range of \\xNN escapes: what Java's String.trim takes off, U+0001 to the space here."
        function: "regexp"
        args: ['^[\x00-\x20]*[+-]?NaN[\x00-\x20]*\z', "\x01-NaN\x1f "]
        result: 1
      - function: "regexp"
        args: ['^[\x00-\x20]*[+-]?NaN[\x00-\x20]*\z', "\x21NaN"]
        result: 0
      - function: "regexp"
        args: ['^[\x00-\x20]*[+-]?NaN[\x00-\x20]*\z', "NaN\u00a0"]
        result: 0
      - note: "\\uNNNN escapes and ranges of them: Cypher's spaces, as compiled SQL writes them, each in, and characters beside them out."
        function: "regexp"
        args: ['^[\x09-\x0d\x1c-\x20\x85\xa0\u1680\u2000-\u200a\u2028-\u2029\u202f\u205f\u3000]*1[\x09-\x0d\x1c-\x20\x85\xa0\u1680\u2000-\u200a\u2028-\u2029\u202f\u205f\u3000]*\z', "\x09\x0d\x1c\x20\x851"]
        result: 1
      - function: "regexp"
        args: ['^[\x09-\x0d\x1c-\x20\x85\xa0\u1680\u2000-\u200a\u2028-\u2029\u202f\u205f\u3000]*1[\x09-\x0d\x1c-\x20\x85\xa0\u1680\u2000-\u200a\u2028-\u2029\u202f\u205f\u3000]*\z', "\u00a0\u1680\u2000\u200a1\u2028\u2029\u202f\u205f\u3000"]
        result: 1
      - function: "regexp"
        args: ['^[\x09-\x0d\x1c-\x20\x85\xa0\u1680\u2000-\u200a\u2028-\u2029\u202f\u205f\u3000]*1\z', "\ufeff1"]
        result: 0
      - function: "regexp"
        args: ['^[\x09-\x0d\x1c-\x20\x85\xa0\u1680\u2000-\u200a\u2028-\u2029\u202f\u205f\u3000]*1\z', "\u200b1"]
        result: 0
      - function: "regexp"
        args: ['^[\x09-\x0d\x1c-\x20\x85\xa0\u1680\u2000-\u200a\u2028-\u2029\u202f\u205f\u3000]*1\z', "\u180e1"]
        result: 0
      - function: "regexp"
        args: ['^[\x09-\x0d\x1c-\x20\x85\xa0\u1680\u2000-\u200a\u2028-\u2029\u202f\u205f\u3000]*1\z', "\x1b1"]
        result: 0
      - note: "[0-9] is ASCII's digits, not another script's."
        function: "regexp"
        args: ['^-?[0-9]{4}-[0-9]{2}-[0-9]{2}\z', '-0044-03-15']
        result: 1
      - function: "regexp"
        args: ['^[0-9]{4}\z', "\uff12\uff10\uff12\uff14"]
        result: 0
      - function: "regexp"
        args: ['^[0-9]{4}\z', "\u0662\u0660\u0662\u0664"]
        result: 0
      - note: "A date's pattern, as compiled SQL tells a kind by it, ends at the text's end."
        function: "regexp"
        args: ['^-?[0-9]{4}-[0-9]{2}-[0-9]{2}\z', "2024-03-15\n"]
        result: 0
      - function: "regexp"
        args: ['^[0-9]{2}:[0-9]{2}(:[0-9]{2}([.][0-9]+)?)?(Z|[+-][0-9]{2}:?[0-9]{2})\z', '10:15:00.5-0530']
        result: 1
      - function: "regexp"
        args: ['^[0-9]{2}:[0-9]{2}(:[0-9]{2}([.][0-9]+)?)?(Z|[+-][0-9]{2}:?[0-9]{2})\z', '10:15x00Z']
        result: 0
      - note: "{m,n} repeats as many as it says, and a backslash makes a character of the syntax itself."
        function: "regexp"
        args: ['^(0|[1-9][0-9]{0,2})\z', '1000']
        result: 0
      - function: "regexp"
        args: ['^\+?Infinity\z', '+Infinity']
        result: 1
      - function: "regexp"
        args: ['^[0-9]+\.?[0-9]*\z', '1x5']
        result: 0

  - name: "drivine_regex_group"
    description: "drivine_regex_group(text, pattern, group) is the text the group of that number matches where the pattern first matches in the text, as Postgres's regexp_match gives it; null where the pattern matches nowhere, or the group takes no part, or the text is null. The pattern is written as regexp's are, and \\z is the text's end."
    pairs:
      temporal.yaml: ["Fields of a duration", "Offset without a colon"]
    steps:
      - function: "drivine_regex_group"
        args: ['10:15-0530', '(Z|[+-][0-9]{2}:?[0-9]{2})\z', 1]
        result: '-0530'
      - function: "drivine_regex_group"
        args: ['2024-03-15T10:30:00Z', '(Z|[+-][0-9]{2}:?[0-9]{2})\z', 1]
        result: 'Z'
      - note: "Not before a line break that ends the text."
        function: "drivine_regex_group"
        args: ["10:15-0530\n", '(Z|[+-][0-9]{2}:?[0-9]{2})\z', 1]
        result: null
      - function: "drivine_regex_group"
        args: ['P1Y2M3DT4H5M6S', '^(-?)P((-?[0-9.]+)Y)?((-?[0-9.]+)M)?((-?[0-9.]+)W)?((-?[0-9.]+)D)?', 3]
        result: '1'
      - function: "drivine_regex_group"
        args: ['P1Y2M3DT4H5M6S', '^(-?)P((-?[0-9.]+)Y)?((-?[0-9.]+)M)?((-?[0-9.]+)W)?((-?[0-9.]+)D)?', 9]
        result: '3'
      - note: "A group that takes no part."
        function: "drivine_regex_group"
        args: ['P1Y2M3DT4H5M6S', '^(-?)P((-?[0-9.]+)Y)?((-?[0-9.]+)M)?((-?[0-9.]+)W)?((-?[0-9.]+)D)?', 7]
        result: null
      - function: "drivine_regex_group"
        args: ['P1Y2M3DT4H5M6.5S', 'T((-?[0-9.]+)H)?((-?[0-9.]+)M)?((-?[0-9.]+)S)?\z', 6]
        result: '6.5'
      - function: "drivine_regex_group"
        args: ["P1DT4H\n", 'T((-?[0-9.]+)H)?((-?[0-9.]+)M)?((-?[0-9.]+)S)?\z', 2]
        result: null
      - function: "drivine_regex_group"
        args: [null, '(Z|[+-][0-9]{2}:?[0-9]{2})\z', 1]
        result: null

  - name: "drivine_regexp_replace"
    description: "drivine_regexp_replace(text, pattern, replacement) is the text with each match of the pattern replaced, a backslash and a digit in the replacement naming a group, as Postgres's and Oracle's name one; null where any is null. The pattern is written as regexp's are, and \\z is the text's end."
    pairs:
      temporal.yaml: ["Offset without a colon", "Zero offset is UTC"]
    steps:
      - function: "drivine_regexp_replace"
        args: ['+00:00', '^[+-]00:?00\z', 'Z']
        result: 'Z'
      - function: "drivine_regexp_replace"
        args: ['-0000', '^[+-]00:?00\z', 'Z']
        result: 'Z'
      - function: "drivine_regexp_replace"
        args: ['+02:00', '^[+-]00:?00\z', 'Z']
        result: '+02:00'
      - note: "Not before a line break that ends the text."
        function: "drivine_regexp_replace"
        args: ["+00:00\n", '^[+-]00:?00\z', 'Z']
        result: "+00:00\n"
      - function: "drivine_regexp_replace"
        args: ['-0530', '^([+-][0-9]{2})([0-9]{2})\z', '\1:\2']
        result: '-05:30'
      - function: "drivine_regexp_replace"
        args: ['-05:30', '^([+-][0-9]{2})([0-9]{2})\z', '\1:\2']
        result: '-05:30'
      - function: "drivine_regexp_replace"
        args: [null, '^[+-]00:?00\z', 'Z']
        result: null

  - name: "Postgres rows of a statement given NaN or an infinity"
    description: "Postgres's jsonb holds neither NaN nor an infinity, so a statement given one (nonFinite) writes stand-in numbers past any double's: NaN is exactly 2e309 + 0.5, a number at or past 1e309 is an infinity, and one at or below -1e309 the negative infinity. They are read as such only in the rows of a statement given one; elsewhere a column is read as JSON is. The tag SQLite writes for NaN is a map on Postgres."
    pairs:
      queries.yaml: ["NaN and the infinities as parameters", "Floats written as text"]
    steps:
      - read: {store: "postgres", nonFinite: true, column: ["2", {$repeat: "0", times: 309}, ".5"]}
        value: {$float: "NaN"}
      - read: {store: "postgres", nonFinite: true, column: ["1", {$repeat: "0", times: 309}, ".5"]}
        value: {$float: "Infinity"}
      - read: {store: "postgres", nonFinite: true, column: ["-1", {$repeat: "0", times: 309}, ".5"]}
        value: {$float: "-Infinity"}
      - read: {store: "postgres", nonFinite: true, column: ["[", "2", {$repeat: "0", times: 309}, ".5, 1.5, 2, ", "-1", {$repeat: "0", times: 309}, ".5]"]}
        value: [{$float: "NaN"}, 1.5, 2, {$float: "-Infinity"}]
      - read: {store: "postgres", nonFinite: true, column: ['{"x": ', "2", {$repeat: "0", times: 309}, ".5}"]}
        value: {x: {$float: "NaN"}}
      - note: "Near miss: just below the stand-in for NaN, and past 1e309, so an infinity."
        read: {store: "postgres", nonFinite: true, column: ["2", {$repeat: "0", times: 309}, ".4"]}
        value: {$float: "Infinity"}
      - note: "Near miss: just past the stand-in for NaN."
        read: {store: "postgres", nonFinite: true, column: ["2", {$repeat: "0", times: 309}, ".6"]}
        value: {$float: "Infinity"}
      - note: "Near miss: the negative of the stand-in for NaN is no NaN."
        read: {store: "postgres", nonFinite: true, column: ["-2", {$repeat: "0", times: 309}, ".5"]}
        value: {$float: "-Infinity"}
      - note: "Exactly 1e309, where the infinities begin."
        read: {store: "postgres", nonFinite: true, column: ["1", {$repeat: "0", times: 309}]}
        value: {$float: "Infinity"}
      - note: "Exactly -1e309, where the negative infinities begin."
        read: {store: "postgres", nonFinite: true, column: ["-1", {$repeat: "0", times: 309}]}
        value: {$float: "-Infinity"}
      - note: "Near miss: below 1e309, and within a double's range."
        read: {store: "postgres", nonFinite: true, column: ["1", {$repeat: "0", times: 308}]}
        value: 1.0E308
      - read: {store: "postgres", nonFinite: true, column: "1.5"}
        value: 1.5
      - read: {store: "postgres", nonFinite: true, column: "2"}
        value: 2
      - note: "The tag SQLite writes for NaN is a map on Postgres."
        read: {store: "postgres", nonFinite: true, column: '{"$numberDouble": "NaN"}'}
        value: {$numberDouble: "NaN"}
      - note: "A whole number past a long's range is a float whose fraction jsonb dropped, as it writes 1e20."
        read: {store: "postgres", nonFinite: false, column: "100000000000000000000"}
        value: 1.0E20
      - read: {store: "postgres", nonFinite: true, column: "100000000000000000000"}
        value: 1.0E20
      - note: "Not given NaN or an infinity, the stand-in is no NaN: it is read as a JSON number past a double's range is."
        read: {store: "postgres", nonFinite: false, column: ["2", {$repeat: "0", times: 309}, ".5"]}
        value: {$float: "Infinity"}

  - name: "SQLite rows that hold NaN"
    description: "SQLite's JSON holds no NaN, so a statement writes it as the tag {\"$numberDouble\":\"NaN\"}, exactly: one key, the text NaN. The tag in a JSON column of a compiled statement's rows is read as NaN, in a list or a map too, where the statement was given NaN or an infinity (nonFinite) and where the column's text holds the tag, as it does where a statement given neither works NaN out. A map with another key, or another text, is the map it is. An infinity, written 9e999, is read as the infinity."
    pairs:
      writes.yaml: ["NaN worked out from stored infinities", "NaN and the infinities written"]
      queries.yaml: ["NaN and the infinities as parameters"]
    steps:
      - read: {store: "sqlite", nonFinite: true, column: '{"$numberDouble":"NaN"}'}
        value: {$float: "NaN"}
      - read: {store: "sqlite", nonFinite: false, column: '{"$numberDouble":"NaN"}'}
        value: {$float: "NaN"}
      - read: {store: "sqlite", nonFinite: false, column: '[1.5,{"$numberDouble":"NaN"}]'}
        value: [1.5, {$float: "NaN"}]
      - read: {store: "sqlite", nonFinite: false, column: '{"a":{"$numberDouble":"NaN"},"b":[9e999,-9e999]}'}
        value: {a: {$float: "NaN"}, b: [{$float: "Infinity"}, {$float: "-Infinity"}]}
      - note: "Not the tag: another text than NaN."
        read: {store: "sqlite", nonFinite: true, column: '{"$numberDouble":"2.0"}'}
        value: {$numberDouble: "2.0"}
      - note: "Not the tag: another text than NaN."
        read: {store: "sqlite", nonFinite: false, column: '[{"$numberDouble":"2.0"},{"$numberDouble":"NaN"}]'}
        value: [{$numberDouble: "2.0"}, {$float: "NaN"}]
      - note: "Not the tag: another key beside it."
        read: {store: "sqlite", nonFinite: true, column: '{"$numberDouble":"NaN","x":1}'}
        value: {$numberDouble: "NaN", x: 1}
      - note: "Not the tag: another key beside it."
        read: {store: "sqlite", nonFinite: false, column: '{"$numberDouble":"NaN","x":1}'}
        value: {$numberDouble: "NaN", x: 1}
      - read: {store: "sqlite", nonFinite: true, column: '9e999'}
        value: {$float: "Infinity"}
      - read: {store: "sqlite", nonFinite: false, column: '[9e999,-9e999]'}
        value: [{$float: "Infinity"}, {$float: "-Infinity"}]
      - read: {store: "sqlite", nonFinite: false, column: '[1,2.0,"NaN"]'}
        value: [1, 2.0, "NaN"]

  - name: "Temporal values' sort keys"
    description: "The sort key s of a temporal value's tag, worked out of its canonical text v alone, as Temporals.key works it out and each store's SQL does (see README.md, Values in the store): digits of one width for each kind, which order two values of a kind as Neo4j does; a zoned time by its UTC nanoseconds of the day plus 18 hours, with no wrap at midnight. A duration has none."
    pairs:
      temporal.yaml: ["A sort key worked out as the statement runs", "A zoned time across midnight", "A zoned time at the offsets' limits", "The extremes of a year, an offset and a fraction"]
    steps:
      - key: {kind: "date", v: "2024-01-01"}
        result: "10000020240101"
      - note: "45 BC, numbered astronomically."
        key: {kind: "date", v: "-0044-03-15"}
        result: "09999999560315"
      - note: "The last date Neo4j holds."
        key: {kind: "date", v: "+999999999-12-31"}
        result: "19999999991231"
      - note: "The first."
        key: {kind: "date", v: "-999999999-01-01"}
        result: "00000000010101"
      - key: {kind: "localtime", v: "00:00:00"}
        result: "00000000000000"
      - key: {kind: "localtime", v: "23:59:59.999999999"}
        result: "86399999999999"
      - key: {kind: "localtime", v: "10:30:00.000001"}
        result: "37800000001000"
      - note: "23:00 UTC of the day before: -1 hour, plus 18."
        key: {kind: "time", v: "01:00:00+02:00"}
        result: "061200000000000072000"
      - key: {kind: "time", v: "22:00:00Z"}
        result: "144000000000000064800"
      - note: "-18 hours: the least."
        key: {kind: "time", v: "00:00:00+18:00"}
        result: "000000000000000129600"
      - note: "42 hours less a nanosecond: the greatest."
        key: {kind: "time", v: "23:59:59.999999999-18:00"}
        result: "215999999999999000000"
      - key: {kind: "localdatetime", v: "2024-03-15T10:30:00.500"}
        result: "10000020240315103000500000000"
      - key: {kind: "datetime", v: "2024-03-15T10:30:00.500+02:00"}
        result: "10000020240315083000500000000072000"
      - note: "UTC a year back."
        key: {kind: "datetime", v: "2024-01-01T01:00:00+02:00"}
        result: "10000020231231230000000000000072000"
      - note: "UTC the leap day before."
        key: {kind: "datetime", v: "2024-03-01T00:30:00+01:00"}
        result: "10000020240229233000000000000068400"
      - note: "UTC a year on."
        key: {kind: "datetime", v: "2024-12-31T23:00:00-02:00"}
        result: "10000020250101010000000000000057600"
      - note: "UTC the year 1,000,000,000: the greatest."
        key: {kind: "datetime", v: "+999999999-12-31T23:59:59.999999999-18:00"}
        result: "20000000000101175959999999999000000"
      - note: "UTC the year -1,000,000,000: the least."
        key: {kind: "datetime", v: "-999999999-01-01T00:00:00+18:00"}
        result: "00000000001231060000000000000129600"
      - note: "A duration has no order."
        key: {kind: "duration", v: "P1D"}
        result: null

  - name: "Rows that hold temporal values and keys that begin with $"
    description: "In a column of a compiled statement's rows, a temporal value's tag, {\"$t\", \"v\", \"s\"} with $t a kind's word and v a text, is read as its text v, in a list or a map too; a map's key that begins with $$ is read with one $ fewer, and any other key as it is. An object whose $t names no kind, or whose v is no text, is a map."
    pairs:
      temporal.yaml: ["ISO text on SQL stores", "A sort key worked out as the statement runs"]
      queries.yaml: ["Map keys that begin with $"]
    steps:
      - read: {store: "postgres", nonFinite: false, column: '{"$t":"date","v":"2024-01-01","s":"10000020240101"}'}
        value: "2024-01-01"
      - read: {store: "postgres", nonFinite: false, column: '{"$t":"datetime","v":"2024-03-15T10:30:00.500+02:00","s":"10000020240315083000500000000072000"}'}
        value: "2024-03-15T10:30:00.500+02:00"
      - read: {store: "postgres", nonFinite: false, column: '{"$t":"duration","v":"P1DT2H"}'}
        value: "P1DT2H"
      - read: {store: "postgres", nonFinite: false, column: '[{"$t":"date","v":"2024-01-01","s":"10000020240101"},{"$t":"duration","v":"P1DT2H"},null]'}
        value: ["2024-01-01", "P1DT2H", null]
      - read: {store: "postgres", nonFinite: false, column: '{"a":{"$t":"date","v":"2024-01-01","s":"10000020240101"},"b":[{"$t":"datetime","v":"2024-03-15T10:30:00.500+02:00","s":"10000020240315083000500000000072000"}]}'}
        value: {a: "2024-01-01", b: ["2024-03-15T10:30:00.500+02:00"]}
      - read: {store: "postgres", nonFinite: false, column: '{"$$t":1,"$$$t":2,"$$x":3,"a$":4}'}
        value: {"$t": 1, "$$t": 2, "$x": 3, "a$": 4}
      - read: {store: "postgres", nonFinite: false, column: '{"$$t":"date","v":"2024-01-01"}'}
        value: {"$t": "date", v: "2024-01-01"}
      - read: {store: "postgres", nonFinite: false, column: '{"$t":"week","v":"2024-W01"}'}
        value: {"$t": "week", v: "2024-W01"}
      - read: {store: "postgres", nonFinite: false, column: '{"$t":"date","v":1}'}
        value: {"$t": "date", v: 1}
      - read: {store: "sqlite", nonFinite: false, column: '{"$t":"date","v":"2024-01-01","s":"10000020240101"}'}
        value: "2024-01-01"
      - read: {store: "sqlite", nonFinite: false, column: '{"$t":"datetime","v":"2024-03-15T10:30:00.500+02:00","s":"10000020240315083000500000000072000"}'}
        value: "2024-03-15T10:30:00.500+02:00"
      - read: {store: "sqlite", nonFinite: false, column: '{"$t":"duration","v":"P1DT2H"}'}
        value: "P1DT2H"
      - read: {store: "sqlite", nonFinite: false, column: '[{"$t":"date","v":"2024-01-01","s":"10000020240101"},{"$t":"duration","v":"P1DT2H"},null]'}
        value: ["2024-01-01", "P1DT2H", null]
      - read: {store: "sqlite", nonFinite: false, column: '{"a":{"$t":"date","v":"2024-01-01","s":"10000020240101"},"b":[{"$t":"datetime","v":"2024-03-15T10:30:00.500+02:00","s":"10000020240315083000500000000072000"}]}'}
        value: {a: "2024-01-01", b: ["2024-03-15T10:30:00.500+02:00"]}
      - read: {store: "sqlite", nonFinite: false, column: '{"$$t":1,"$$$t":2,"$$x":3,"a$":4}'}
        value: {"$t": 1, "$$t": 2, "$x": 3, "a$": 4}
      - read: {store: "sqlite", nonFinite: false, column: '{"$$t":"date","v":"2024-01-01"}'}
        value: {"$t": "date", v: "2024-01-01"}
      - read: {store: "sqlite", nonFinite: false, column: '{"$t":"week","v":"2024-W01"}'}
        value: {"$t": "week", v: "2024-W01"}
      - read: {store: "sqlite", nonFinite: false, column: '{"$t":"date","v":1}'}
        value: {"$t": "date", v: 1}


