# drivine4j#819's rebinding table: a name a subquery has from outside it, m1, bound again within it, by each binder, in
# each context, with two controls, and what Neo4j 2026.10.1 does with each, each statement run over queries.yaml's graph
# alone, as EXPLAIN and as a run. Then a canary: a sample of contexts two deep, alike. See README.md, "Rebinding a
# variable from outside a subquery".
name: "m1"
contexts:
  - {name: "CALL (x) importing it", outer: "MATCH (q:Person {name: 'Carrie'})-[:ACTED_IN]->({o}) CALL ({o}) { {body} } RETURN {o}.title AS title, y ORDER BY title, y", inner: "CALL ({o}) { {body} } RETURN y"}
  - {name: "CALL (*)", outer: "MATCH (q:Person {name: 'Carrie'})-[:ACTED_IN]->({o}) CALL (*) { {body} } RETURN {o}.title AS title, y ORDER BY title, y", inner: "CALL (*) { {body} } RETURN y"}
  - {name: "CALL () at the top level", outer: "MATCH (q:Person {name: 'Carrie'})-[:ACTED_IN]->({o}) CALL () { {body} } RETURN {o}.title AS title, y ORDER BY title, y", inner: "CALL () { {body} } RETURN y"}
  - {name: "CALL () inside EXISTS", outer: "MATCH (q:Person {name: 'Carrie'})-[:ACTED_IN]->({o}) RETURN {o}.title AS title, EXISTS { CALL () { {body} } RETURN y } AS y ORDER BY title", inner: "RETURN EXISTS { CALL () { {body} } RETURN y } AS y"}
  - {name: "CALL () inside COUNT", outer: "MATCH (q:Person {name: 'Carrie'})-[:ACTED_IN]->({o}) RETURN {o}.title AS title, COUNT { CALL () { {body} } RETURN y } AS y ORDER BY title", inner: "RETURN COUNT { CALL () { {body} } RETURN y } AS y"}
  - {name: "EXISTS", outer: "MATCH (q:Person {name: 'Carrie'})-[:ACTED_IN]->({o}) RETURN {o}.title AS title, EXISTS { {body} } AS y ORDER BY title", inner: "RETURN EXISTS { {body} } AS y"}
  - {name: "COUNT", outer: "MATCH (q:Person {name: 'Carrie'})-[:ACTED_IN]->({o}) RETURN {o}.title AS title, COUNT { {body} } AS y ORDER BY title", inner: "RETURN COUNT { {body} } AS y"}
binders:
  - {name: "a WITH alias", bind: "WITH 'w' AS {v} RETURN {v} AS y", read: "WITH {v} AS z RETURN z.title AS y"}
  - {name: "an UNWIND alias", bind: "UNWIND ['u'] AS {v} RETURN {v} AS y", read: "UNWIND [{v}] AS z RETURN z.title AS y"}
  - {name: "a CALL subquery's RETURN item", bind: "CALL () { RETURN 'c' AS {v} } RETURN {v} AS y", read: "CALL ({v}) { RETURN {v}.title AS z } RETURN z AS y"}
  - {name: "a FOREACH variable", bind: "FOREACH ({v} IN [] | CREATE (:Tmp)) RETURN 'f' AS y", read: "FOREACH (z IN [{v}][0..0] | CREATE (:Tmp)) RETURN 'f' AS y"}
  - {name: "a MATCH pattern variable", bind: "MATCH ({v}:Movie) RETURN {v}.title AS y", read: "MATCH (z:Movie) WHERE z = {v} RETURN z.title AS y"}
  - {name: "an OPTIONAL MATCH pattern variable", bind: "OPTIONAL MATCH ({v}:Movie) RETURN {v}.title AS y", read: "OPTIONAL MATCH (z:Movie) WHERE z = {v} RETURN z.title AS y"}
variants:
  - {name: "bound outside", outer: "m1", body: "bind"}
  - {name: "not bound outside", outer: "m0", body: "bind"}
  - {name: "only read", outer: "m1", body: "read"}
cells:
  - contexts: ["CALL (x) importing it"]
    binder: "a WITH alias"
    variant: "bound outside"
    cypher: "MATCH (q:Person {name: 'Carrie'})-[:ACTED_IN]->(m1) CALL (m1) { WITH 'w' AS m1 RETURN m1 AS y } RETURN m1.title AS title, y ORDER BY title, y"
    neo4j: "42N07"
    error: "The variable m1 is shadowing a variable with the same name from the outer scope, as in Neo4j: rename it."
  - contexts: ["CALL (x) importing it"]
    binder: "a WITH alias"
    variant: "not bound outside"
    cypher: "MATCH (q:Person {name: 'Carrie'})-[:ACTED_IN]->(m0) CALL (m0) { WITH 'w' AS m1 RETURN m1 AS y } RETURN m0.title AS title, y ORDER BY title, y"
    neo4j: "rows"
    rows: [["The Matrix", "w"], ["The Matrix Reloaded", "w"]]
