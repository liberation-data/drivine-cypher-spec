# A store's layout migrated from layout 1 to layout 2 (liberation-data/drivine-cypher-spec#256). See README.md, "Migrating a
# store's layout". Each of `rewrites` is a row of layout 1, the JSON text a store gives of a node's or a relationship's
# properties, rewritten as layout 2 holds it, for a node of `labels` (a relationship's type, for one) under
# `declarations`: what the module's LayoutMigration.rewrite, or the JSON request {"rewrite": …}, gives, compared exactly.
from: 1
to: 2
statements:
  # The statements a migration runs on each store, for the graph `drivine` (MigrationStatements): see README.md, "Migrating a
  # store's layout". Each binds its parameters by name; each that gives rows gives each as one JSON object.
  postgres:
    readBatch:
      nodes: |-
        SELECT jsonb_build_object('id', nid, 'labels', labels, 'props', props::text) FROM drivine_node
        WHERE nid > CAST($after AS bigint) ORDER BY nid LIMIT CAST($limit AS integer)
      edges: |-
        SELECT jsonb_build_object('id', eid, 'labels', jsonb_build_array(type), 'props', props::text) FROM drivine_edge
        WHERE eid > CAST($after AS bigint) ORDER BY eid LIMIT CAST($limit AS integer)
    update:
      nodes: "UPDATE drivine_node SET props = CAST($props AS jsonb) WHERE nid = CAST($id AS bigint)"
      edges: "UPDATE drivine_edge SET props = CAST($props AS jsonb) WHERE eid = CAST($id AS bigint)"
    own: "SELECT jsonb_build_object('id', n.nid, 'props', n.props::text) FROM drivine_node n WHERE (n.labels @> '[\"DrivineStore\"]' OR n.labels @> '[\"_DrivineSchema\"]') ORDER BY n.nid"
    sizes: "SELECT jsonb_build_object('nodes', (SELECT count(*) FROM drivine_node), 'lastNode', (SELECT max(nid) FROM drivine_node), 'edges', (SELECT count(*) FROM drivine_edge), 'lastEdge', (SELECT max(eid) FROM drivine_edge))"
    createCheckpoint: "CREATE TABLE IF NOT EXISTS drivine_migrate2 (name text PRIMARY KEY, state text NOT NULL)"
    readCheckpoint: "SELECT jsonb_build_object('name', name, 'state', state) FROM drivine_migrate2 ORDER BY name"
    writeCheckpoint: |-
      INSERT INTO drivine_migrate2 (name, state) VALUES (CAST($name AS text), CAST($state AS text))
      ON CONFLICT (name) DO UPDATE SET state = EXCLUDED.state
    dropCheckpoint: "DROP TABLE IF EXISTS drivine_migrate2"
    lock: "SELECT name FROM drivine_lock2 WHERE name = 'schema' FOR UPDATE"
    uniques: "SELECT jsonb_build_object('label', label, 'properties', properties) FROM drivine_schema WHERE kind = 'UNIQUENESS_CONSTRAINT' ORDER BY label, properties"
    stampLayout: "UPDATE drivine_node n SET props = n.props || jsonb_build_object('layout', 2) WHERE n.labels @> '[\"DrivineStore\"]'"
  oracle:
    readBatch:
      nodes: |-
        SELECT JSON_OBJECT('id' VALUE nid, 'labels' VALUE labels, 'props' VALUE TO_CLOB(JSON_SERIALIZE(props RETURNING CLOB EXTENDED)) RETURNING JSON) FROM drivine_node
        WHERE nid > $after ORDER BY nid FETCH FIRST $limit ROWS ONLY
      edges: |-
        SELECT JSON_OBJECT('id' VALUE eid, 'labels' VALUE JSON_ARRAY(type), 'props' VALUE TO_CLOB(JSON_SERIALIZE(props RETURNING CLOB EXTENDED)) RETURNING JSON) FROM drivine_edge
        WHERE eid > $after ORDER BY eid FETCH FIRST $limit ROWS ONLY
    update:
      nodes: "UPDATE drivine_node SET props = JSON($props EXTENDED) WHERE nid = $id"
      edges: "UPDATE drivine_edge SET props = JSON($props EXTENDED) WHERE eid = $id"
    own: "SELECT JSON_OBJECT('id' VALUE n.nid, 'props' VALUE TO_CLOB(JSON_SERIALIZE(n.props RETURNING CLOB EXTENDED)) RETURNING JSON) FROM drivine_node n WHERE (INSTR(',' || LTRIM(RTRIM(JSON_SERIALIZE(n.labels), ']'), '[') || ',\"', ',\"DrivineStore\",\"') > 0 OR INSTR(',' || LTRIM(RTRIM(JSON_SERIALIZE(n.labels), ']'), '[') || ',\"', ',\"_DrivineSchema\",\"') > 0) ORDER BY n.nid"
    sizes: "SELECT JSON_OBJECT('nodes' VALUE (SELECT COUNT(*) FROM drivine_node), 'lastNode' VALUE (SELECT MAX(nid) FROM drivine_node), 'edges' VALUE (SELECT COUNT(*) FROM drivine_edge), 'lastEdge' VALUE (SELECT MAX(eid) FROM drivine_edge) NULL ON NULL RETURNING JSON) FROM dual"
    createCheckpoint: "CREATE TABLE IF NOT EXISTS drivine_migrate2 (name VARCHAR2(400) PRIMARY KEY, state CLOB NOT NULL)"
    readCheckpoint: "SELECT JSON_OBJECT('name' VALUE name, 'state' VALUE state RETURNING JSON) FROM drivine_migrate2 ORDER BY name"
    writeCheckpoint: |-
      MERGE INTO drivine_migrate2 c USING (SELECT $name AS name, TO_CLOB($state) AS state FROM dual) s ON (c.name = s.name)
      WHEN MATCHED THEN UPDATE SET c.state = s.state WHEN NOT MATCHED THEN INSERT (name, state) VALUES (s.name, s.state)
    dropCheckpoint: "DROP TABLE IF EXISTS drivine_migrate2 PURGE"
    lock: "SELECT name FROM drivine_lock2 WHERE name = 'schema' FOR UPDATE WAIT 10"
    uniques: "SELECT JSON_OBJECT('label' VALUE label, 'properties' VALUE properties RETURNING JSON) FROM drivine_schema WHERE kind = 'UNIQUENESS_CONSTRAINT' ORDER BY label, properties"
    stampLayout: "UPDATE drivine_node n SET n.props = JSON_TRANSFORM(n.props, SET '$.layout' = 2) WHERE JSON_EXISTS(n.labels, '$[*]?(@ == \"DrivineStore\")')"
  sqlite:
    readBatch:
      nodes: |-
        /* drivine:json */
        SELECT json_object('id', nid, 'labels', json(labels), 'props', props) FROM drivine_node
        WHERE nid > $after ORDER BY nid LIMIT $limit
      edges: |-
        /* drivine:json */
        SELECT json_object('id', eid, 'labels', json_array(type), 'props', props) FROM drivine_edge
        WHERE eid > $after ORDER BY eid LIMIT $limit
    update:
      nodes: "UPDATE drivine_node SET props = $props WHERE nid = $id"
      edges: "UPDATE drivine_edge SET props = $props WHERE eid = $id"
    own: |-
      /* drivine:json */
      SELECT json_object('id', n.nid, 'props', n.props) FROM drivine_node n WHERE (instr(n.labels, '"DrivineStore"') > 0 OR instr(n.labels, '"_DrivineSchema"') > 0) ORDER BY n.nid
    sizes: |-
      /* drivine:json */
      SELECT json_object('nodes', (SELECT count(*) FROM drivine_node), 'lastNode', (SELECT max(nid) FROM drivine_node), 'edges', (SELECT count(*) FROM drivine_edge), 'lastEdge', (SELECT max(eid) FROM drivine_edge))
    createCheckpoint: "CREATE TABLE IF NOT EXISTS drivine_migrate2 (name TEXT PRIMARY KEY, state TEXT NOT NULL)"
    readCheckpoint: |-
      /* drivine:json */
      SELECT json_object('name', name, 'state', state) FROM drivine_migrate2 ORDER BY name
    writeCheckpoint: |-
      INSERT INTO drivine_migrate2 (name, state) VALUES ($name, $state)
      ON CONFLICT (name) DO UPDATE SET state = excluded.state
    dropCheckpoint: "DROP TABLE IF EXISTS drivine_migrate2"
    lock: null
    uniques: |-
      /* drivine:json */
      SELECT json_object('label', label, 'properties', properties) FROM drivine_schema WHERE kind = 'UNIQUENESS_CONSTRAINT' ORDER BY label, properties
    stampLayout: "UPDATE drivine_node SET props = json_set(props, '$.layout', 2) WHERE nid IN (SELECT n.nid FROM drivine_node n WHERE instr(n.labels, '\"DrivineStore\"') > 0)"
finished:
  # A graph once its migration is finished: stamped layout 2, layout 1's indexes dropped with their records, the checkpoint
  # table dropped last. The verdict judges it an ordinary graph of layout 2, current, whose indexes an application's schema
  # plan makes at its next start. An unstamped graph is stamped by assignIfAbsent, of layout 2, and judged so too.
  - {store: "postgres", stamps: [{layout: 2}], foreignNodes: true, objects: [{name: "drivine_lock2", type: "TABLE"}], verdict: "current"}
  - {store: "oracle", stamps: [{layout: 2}], foreignNodes: true, objects: [{name: "drivine_lock2", type: "TABLE"}, {name: "drivine_count2", type: "TABLE"}], verdict: "current"}
  - {store: "sqlite", stamps: [{layout: 2}], foreignNodes: true, objects: [{name: "drivine_lock2", type: "TABLE"}], verdict: "current"}
declarationRefusals:
  - name: "One label's property declared two kinds"
    declarations: [{label: "Person", property: "born", kind: "date"}, {label: "Person", property: "born", kind: "datetime"}]
    refusal: "The property born of Person is declared date and datetime: declare one kind."
  - name: "Drivine's own label declared"
    declarations: [{label: "_DrivineSchema", property: "version", kind: "float"}]
    refusal: "_DrivineSchema is Drivine's own label, whose properties take no declaration: a migration keeps them as they are."
rewrites:
  - name: "A row with nothing to change"
    description: "Texts, integers, truth values and lists of them, with no property declared: held alike in both layouts."
    labels: ["Person"]
    declarations: []
    stores:
      postgres: {props: '{"ok": true, "age": 36, "name": "Ada", "tags": ["a", "b"]}', result: '{"ok":true,"age":36,"name":"Ada","tags":["a","b"]}'}
      oracle: {props: '{"name":"Ada","age":36,"ok":true,"tags":["a","b"]}', result: '{"name":"Ada","age":36,"ok":true,"tags":["a","b"]}'}
      sqlite: {props: '{"name":"Ada","age":36,"ok":true,"tags":["a","b"]}', result: '{"name":"Ada","age":36,"ok":true,"tags":["a","b"]}'}
  - name: "Floats on Postgres and SQLite"
    description: "A float with a point is a float in both layouts, on Postgres and SQLite, as is an infinity as SQLite's JSON writes it, 9e999; a whole number is an integer, unless declared a float."
    labels: ["Reading"]
    declarations: []
    stores:
      postgres: {props: '{"a": 2.0, "b": 1.5, "c": 10000000000000000}', result: '{"a":2.0,"b":1.5,"c":10000000000000000}'}
      sqlite: {props: '{"a":2.0,"b":1.5,"c":10000000000000000,"i":9e999,"j":-9e999}', result: '{"a":2.0,"b":1.5,"c":10000000000000000,"i":9e999,"j":-9e999}'}
  - name: "A property whose name begins with $"
    description: "Held with one more $ in layout 2, at any depth of $, whatever its value; one with a $ after its first character is held as it is."
    labels: ["Person"]
    declarations: []
    stores:
      postgres:
        props: '{"a$": 2, "$t": 1, "$$x": "a"}'
        result: '{"a$":2,"$$t":1,"$$$x":"a"}'
        changes: [{property: "$t", change: "escapedKey"}, {property: "$$x", change: "escapedKey"}]
      oracle:
        props: '{"$t":1,"$$x":"a","a$":2}'
        result: '{"$$t":1,"$$$x":"a","a$":2}'
        changes: [{property: "$t", change: "escapedKey"}, {property: "$$x", change: "escapedKey"}]
      sqlite:
        props: '{"$t":1,"$$x":"a","a$":2}'
        result: '{"$$t":1,"$$$x":"a","a$":2}'
        changes: [{property: "$t", change: "escapedKey"}, {property: "$$x", change: "escapedKey"}]
  - name: "A map's key that begins with $"
    description: "A key of a map in a property's value is held with one more $ too, at any depth, so the row is to be written; on Oracle a map of one such key, which is none of extended JSON's, too."
    labels: ["Person"]
    declarations: []
    stores:
      postgres:
        props: '{"m": {"a": 2, "$k": {"$j": 1}}}'
        result: '{"m":{"a":2,"$$k":{"$$j":1}}}'
        changes: [{property: "m", change: "escapedKey"}]
      oracle:
        props: '{"m":{"$k":{"$j":1},"a":2},"n":{"$k":1}}'
        result: '{"m":{"$$k":{"$$j":1},"a":2},"n":{"$$k":1}}'
        changes: [{property: "m", change: "escapedKey"}, {property: "n", change: "escapedKey"}]
      sqlite:
        props: '{"m":{"$k":{"$j":1},"a":2}}'
        result: '{"m":{"$$k":{"$$j":1},"a":2}}'
        changes: [{property: "m", change: "escapedKey"}]
  - name: "A NUMBER with a fraction on Oracle"
    description: "Layout 1's saves wrote every float on Oracle as a NUMBER; one with a fraction is a float, as no integer has one, and is a binary double in layout 2, with no declaration: a float id 4.5, keyed as 4.5 in layout 1, is keyed as layout 2 keys a lookup of it. A whole NUMBER stays an integer, unless declared a float; a binary double already is one."
    labels: ["Reading"]
    declarations: []
    stores:
      oracle:
        props: '{"id":4.5,"n":2,"l":[1.5,2],"d":{"$numberDouble":"1.5"},"w":{"$numberDouble":2}}'
        result: '{"id":{"$numberDouble":"4.5"},"n":2,"l":[{"$numberDouble":"1.5"},2],"d":{"$numberDouble":"1.5"},"w":{"$numberDouble":"2.0"}}'
        changes: [{property: "id", change: "double"}, {property: "l", change: "double"}]
  - name: "A property declared a date"
    description: "A text of a property declared a date is its tag, canonical, with its sort key; a property of the same text declared nothing for the row's labels, only for another label, stays a text."
    labels: ["Person"]
    declarations: [{label: "Person", property: "born", kind: "date"}, {label: "Robot", property: "name", kind: "date"}]
    stores:
      postgres:
        props: '{"born": "2024-03-15", "name": "2024-03-15"}'
        result: '{"born":{"$t":"date","v":"2024-03-15","s":"10000020240315"},"name":"2024-03-15"}'
        changes: [{property: "born", change: "temporal"}]
      oracle:
        props: '{"born":"2024-03-15","name":"2024-03-15"}'
        result: '{"born":{"$t":"date","v":"2024-03-15","s":"10000020240315"},"name":"2024-03-15"}'
        changes: [{property: "born", change: "temporal"}]
      sqlite:
        props: '{"born":"2024-03-15","name":"2024-03-15"}'
        result: '{"born":{"$t":"date","v":"2024-03-15","s":"10000020240315"},"name":"2024-03-15"}'
        changes: [{property: "born", change: "temporal"}]
  - name: "Moments as each library's layout 1 wrote them"
    description: "drivine4j's text with a fraction of one digit, JavaScript's toISOString in UTC, java.time's ZonedDateTime with its named zone after the offset, which layout 2 holds no more of, a zone of a fixed offset too (GMT+01:00), and Python's str, a space between the date and the time: each its tag, canonical, its sort key that of its moment in UTC, then its offset."
    labels: ["Event"]
    declarations:
      - {label: "Event", property: "a", kind: "datetime"}
      - {label: "Event", property: "b", kind: "datetime"}
      - {label: "Event", property: "c", kind: "datetime"}
      - {label: "Event", property: "d", kind: "datetime"}
      - {label: "Event", property: "e", kind: "datetime"}
    stores:
      sqlite:
        props: '{"a":"2024-03-15T10:30:00.5+02:00","b":"2024-03-15T08:30:00.500Z","c":"2024-03-15T10:30+01:00[Europe/Paris]","d":"2024-03-15 10:30:00+02:00","e":"2024-03-15T10:30+01:00[GMT+01:00]"}'
        result: '{"a":{"$t":"datetime","v":"2024-03-15T10:30:00.500+02:00","s":"10000020240315083000500000000072000"},"b":{"$t":"datetime","v":"2024-03-15T08:30:00.500Z","s":"10000020240315083000500000000064800"},"c":{"$t":"datetime","v":"2024-03-15T10:30:00+01:00","s":"10000020240315093000000000000068400"},"d":{"$t":"datetime","v":"2024-03-15T10:30:00+02:00","s":"10000020240315083000000000000072000"},"e":{"$t":"datetime","v":"2024-03-15T10:30:00+01:00","s":"10000020240315093000000000000068400"}}'
        changes: [{property: "a", change: "temporal"}, {property: "b", change: "temporal"}, {property: "c", change: "temporal"}, {property: "d", change: "temporal"}, {property: "e", change: "temporal"}]
  - name: "Each other temporal kind"
    description: "A local moment, a local time and a time written without their seconds, and durations, one of a week: each its tag, canonical; a duration has no sort key."
    labels: ["Event"]
    declarations:
      - {label: "Event", property: "ldt", kind: "localdatetime"}
      - {label: "Event", property: "lt", kind: "localtime"}
      - {label: "Event", property: "t", kind: "time"}
      - {label: "Event", property: "dur", kind: "duration"}
      - {label: "Event", property: "week", kind: "duration"}
    stores:
      postgres:
        props: '{"t": "10:30+02:00", "lt": "10:30", "dur": "PT36H", "ldt": "2024-03-15T10:30", "week": "P1W"}'
        result: '{"t":{"$t":"time","v":"10:30:00+02:00","s":"095400000000000072000"},"lt":{"$t":"localtime","v":"10:30:00","s":"37800000000000"},"dur":{"$t":"duration","v":"PT36H"},"ldt":{"$t":"localdatetime","v":"2024-03-15T10:30:00","s":"10000020240315103000000000000"},"week":{"$t":"duration","v":"P7D"}}'
        changes: [{property: "t", change: "temporal"}, {property: "lt", change: "temporal"}, {property: "dur", change: "temporal"}, {property: "ldt", change: "temporal"}, {property: "week", change: "temporal"}]
  - name: "A list declared of dates"
    description: "Each item its tag."
    labels: ["Person"]
    declarations: [{label: "Person", property: "days", kind: "date"}]
    stores:
      sqlite:
        props: '{"days":["2024-03-15","2024-03-16"]}'
        result: '{"days":[{"$t":"date","v":"2024-03-15","s":"10000020240315"},{"$t":"date","v":"2024-03-16","s":"10000020240316"}]}'
        changes: [{property: "days", change: "temporal"}]
  - name: "Values that are no value of their declared kind"
    description: "Each is kept as it was, and named, with why: a migration refuses to write them unless told to keep them so. A list with one such item is kept whole. An offset with seconds, as java.time and Python write a moment in a named zone before its standard time (Paris's +00:09:21 before 1911), is named as such, with its named zone or without."
    labels: ["Person"]
    declarations:
      - {label: "Person", property: "a", kind: "date"}
      - {label: "Person", property: "b", kind: "date"}
      - {label: "Person", property: "c", kind: "datetime"}
      - {label: "Person", property: "d", kind: "date"}
      - {label: "Person", property: "e", kind: "date"}
      - {label: "Person", property: "f", kind: "float"}
      - {label: "Person", property: "g", kind: "duration"}
      - {label: "Person", property: "h", kind: "date"}
      - {label: "Person", property: "i", kind: "datetime"}
      - {label: "Person", property: "j", kind: "datetime"}
    stores:
      sqlite:
        props: '{"a":"yesterday","b":"2024-03-15T10:30","c":"2024-03-15T10:30[Europe/Paris]","d":42,"e":["2024-03-15","soon"],"f":"many","g":"2024-03-15","h":"2024-02-30","i":"1900-01-01T00:00+00:09:21[Europe/Paris]","j":"1900-01-01T00:00:00+00:09:21"}'
        result: '{"a":"yesterday","b":"2024-03-15T10:30","c":"2024-03-15T10:30[Europe/Paris]","d":42,"e":["2024-03-15","soon"],"f":"many","g":"2024-03-15","h":"2024-02-30","i":"1900-01-01T00:00+00:09:21[Europe/Paris]","j":"1900-01-01T00:00:00+00:09:21"}'
        invalid:
          - {property: "a", kind: "date", value: '"yesterday"', message: "'yesterday' is no date."}
          - {property: "b", kind: "date", value: '"2024-03-15T10:30"', message: "'2024-03-15T10:30' is a localdatetime, not a date."}
          - {property: "c", kind: "datetime", value: '"2024-03-15T10:30[Europe/Paris]"', message: "'2024-03-15T10:30[Europe/Paris]' names a zone without its offset, which layout 2 can't hold: give the offset, as in 2024-03-15T10:30+01:00."}
          - {property: "d", kind: "date", value: '42', message: "42 is no text, so no date."}
          - {property: "e", kind: "date", value: '["2024-03-15","soon"]', message: "'soon' is no date."}
          - {property: "f", kind: "float", value: '"many"', message: "\"many\" is no number, so no float."}
          - {property: "g", kind: "duration", value: '"2024-03-15"', message: "'2024-03-15' is no duration."}
          - {property: "h", kind: "date", value: '"2024-02-30"', message: "'2024-02-30' is no date: Text '2024-02-30' could not be parsed: Invalid date 'FEBRUARY 30'"}
          - {property: "i", kind: "datetime", value: '"1900-01-01T00:00+00:09:21[Europe/Paris]"', message: "'1900-01-01T00:00+00:09:21[Europe/Paris]' has the offset with seconds +00:09:21, which layout 2 can't hold."}
          - {property: "j", kind: "datetime", value: '"1900-01-01T00:00:00+00:09:21"', message: "'1900-01-01T00:00:00+00:09:21' has the offset with seconds +00:09:21, which layout 2 can't hold."}
  - name: "A property declared a float"
    description: "A whole number is made a float, and a float stays one; NaN and the infinities, which layout 1's saves wrote as texts, are made floats where the store holds them, and are kept as texts, named, where it doesn't: Postgres holds none of them, SQLite no NaN. On Oracle a binary double, NaN too, already is one, and is changed in nothing."
    labels: ["Reading"]
    declarations:
      - {label: "Reading", property: "w", kind: "float"}
      - {label: "Reading", property: "f", kind: "float"}
      - {label: "Reading", property: "nan", kind: "float"}
      - {label: "Reading", property: "inf", kind: "float"}
      - {label: "Reading", property: "ninf", kind: "float"}
      - {label: "Reading", property: "dnan", kind: "float"}
      - {label: "Reading", property: "d", kind: "float"}
    stores:
      postgres:
        props: '{"f": 1.5, "w": 2, "inf": "Infinity", "nan": "NaN", "ninf": "-Infinity"}'
        result: '{"f":1.5,"w":2.0,"inf":"Infinity","nan":"NaN","ninf":"-Infinity"}'
        changes: [{property: "w", change: "float"}]
        invalid:
          - {property: "inf", kind: "float", value: '"Infinity"', message: "A statement that writes is given NaN or an infinity, which Postgres's `jsonb` holds as no number: it would store another value in its place."}
          - {property: "nan", kind: "float", value: '"NaN"', message: "A statement that writes is given NaN or an infinity, which Postgres's `jsonb` holds as no number: it would store another value in its place."}
          - {property: "ninf", kind: "float", value: '"-Infinity"', message: "A statement that writes is given NaN or an infinity, which Postgres's `jsonb` holds as no number: it would store another value in its place."}
      oracle:
        props: '{"w":2,"f":1.5,"nan":"NaN","inf":"Infinity","ninf":"-Infinity","dnan":{"$numberDouble":"NaN"},"d":{"$numberDouble":"1.5"}}'
        result: '{"w":{"$numberDouble":"2.0"},"f":{"$numberDouble":"1.5"},"nan":{"$numberDouble":"NaN"},"inf":{"$numberDouble":"Infinity"},"ninf":{"$numberDouble":"-Infinity"},"dnan":{"$numberDouble":"NaN"},"d":{"$numberDouble":"1.5"}}'
        changes: [{property: "w", change: "float"}, {property: "f", change: "double"}, {property: "nan", change: "float"}, {property: "inf", change: "float"}, {property: "ninf", change: "float"}]
      sqlite:
        props: '{"w":2,"f":1.5,"nan":"NaN","inf":"Infinity","ninf":"-Infinity"}'
        result: '{"w":2.0,"f":1.5,"nan":"NaN","inf":9e999,"ninf":-9e999}'
        changes: [{property: "w", change: "float"}, {property: "inf", change: "float"}, {property: "ninf", change: "float"}]
        invalid:
          - {property: "nan", kind: "float", value: '"NaN"', message: "A statement that writes is given NaN, which SQLite's JSON holds as no number: it would store another value in its place."}
  - name: "A whole number past a long declared a float"
    description: "Made the float nearest it, as any whole number declared a float is; declared nothing, it stays the whole number it is."
    labels: ["Reading"]
    declarations: [{label: "Reading", property: "f", kind: "float"}]
    stores:
      postgres:
        props: '{"f": 10000000000000000000, "n": 10000000000000000000}'
        result: '{"f":10000000000000000000.0,"n":10000000000000000000}'
        changes: [{property: "f", change: "float"}]
      sqlite:
        props: '{"f":10000000000000000000,"n":10000000000000000000}'
        result: '{"f":1.0E19,"n":10000000000000000000}'
        changes: [{property: "f", change: "float"}]
  - name: "A list declared of floats"
    description: "Each whole number in it made a float; on Oracle a NUMBER with a fraction in it is the change any such NUMBER is."
    labels: ["Reading"]
    declarations: [{label: "Reading", property: "l", kind: "float"}]
    stores:
      oracle:
        props: '{"l":[1.5,2]}'
        result: '{"l":[{"$numberDouble":"1.5"},{"$numberDouble":"2.0"}]}'
        changes: [{property: "l", change: "double"}, {property: "l", change: "float"}]
      postgres:
        props: '{"l": [1.5, 2]}'
        result: '{"l":[1.5,2.0]}'
        changes: [{property: "l", change: "float"}]
  - name: "A property declared bytes"
    description: "Base64 text and a list of unsigned bytes are each the list of their signed values, as layout 2 and the graph engines hold bytes; a list of signed bytes, from -128, already is one. Text of no base64, a list with an item that is no byte (past 255, before -128, or no whole number), and a value of neither are kept as they were, and named."
    labels: ["File"]
    declarations:
      - {label: "File", property: "a", kind: "bytes"}
      - {label: "File", property: "b", kind: "bytes"}
      - {label: "File", property: "c", kind: "bytes"}
      - {label: "File", property: "d", kind: "bytes"}
      - {label: "File", property: "e", kind: "bytes"}
      - {label: "File", property: "f", kind: "bytes"}
      - {label: "File", property: "g", kind: "bytes"}
      - {label: "File", property: "h", kind: "bytes"}
    stores:
      postgres:
        props: '{"a": "AQL/", "b": [1, 2, 255], "c": [-128, 2, -1], "d": "!!", "e": [1, 256], "f": [1, 1.5], "g": 7, "h": [-129]}'
        result: '{"a":[1,2,-1],"b":[1,2,-1],"c":[-128,2,-1],"d":"!!","e":[1,256],"f":[1,1.5],"g":7,"h":[-129]}'
        changes: [{property: "a", change: "bytes"}, {property: "b", change: "bytes"}]
        invalid:
          - {property: "d", kind: "bytes", value: '"!!"', message: "'!!' is no base64 text, so no bytes."}
          - {property: "e", kind: "bytes", value: '[1,256]', message: "[1,256] holds 256, which is no byte."}
          - {property: "f", kind: "bytes", value: '[1,1.5]', message: "[1,1.5] holds 1.5, which is no byte."}
          - {property: "g", kind: "bytes", value: '7', message: "7 is no base64 text or list of bytes."}
          - {property: "h", kind: "bytes", value: '[-129]', message: "[-129] holds -129, which is no byte."}
  - name: "A node of two labels that declare one property two kinds"
    description: "Its value can't be told: it is kept as it was, and named. A property both labels declare one kind is made that kind's."
    labels: ["Person", "Robot"]
    declarations:
      - {label: "Person", property: "born", kind: "date"}
      - {label: "Robot", property: "born", kind: "datetime"}
      - {label: "Person", property: "made", kind: "date"}
      - {label: "Robot", property: "made", kind: "date"}
    stores:
      sqlite:
        props: '{"born":"2024-03-15","made":"2024-03-16"}'
        result: '{"born":"2024-03-15","made":{"$t":"date","v":"2024-03-16","s":"10000020240316"}}'
        changes: [{property: "made", change: "temporal"}]
        invalid:
          - {property: "born", kind: "date", value: '"2024-03-15"', message: "A node of the labels Person, Robot has born declared date and datetime: it is kept as it was."}
  - name: "A relationship's property"
    description: "Declared by the relationship's type, as a node's is by its label."
    labels: ["KNOWS"]
    declarations: [{label: "KNOWS", property: "since", kind: "date"}]
    stores:
      postgres:
        props: '{"since": "2020-01-01"}'
        result: '{"since":{"$t":"date","v":"2020-01-01","s":"10000020200101"}}'
        changes: [{property: "since", change: "temporal"}]
  - name: "A property whose name begins with $, declared"
    description: "Declared by the name the user gives it; held with one more $, as its value's tag."
    labels: ["Person"]
    declarations: [{label: "Person", property: "$at", kind: "date"}]
    stores:
      oracle:
        props: '{"$at":"2024-03-15"}'
        result: '{"$$at":{"$t":"date","v":"2024-03-15","s":"10000020240315"}}'
        changes: [{property: "$at", change: "escapedKey"}, {property: "$at", change: "temporal"}]
