# drivine4j#681's nesting table: a reference to a variable a WITH drops, p, or a control, in each outer context, under each
# nesting of subqueries, comprehensions and CALLs up to two deep, and what Neo4j 2026.10.1 does with it, each statement run
# over queries.yaml's graph alone, as EXPLAIN and as a run. Then a canary: a sample of three-deep nestings, alike. See
# README.md, "Nestings of a dropped variable".
contexts:
  - {name: "no WITH, in a MATCH's WHERE", anchor: "q", cypher: "MATCH (p:Person) MATCH (q:Person) WHERE q = p AND {hole} RETURN q.name ORDER BY q.name"}
  - {name: "no WITH, in a RETURN's ORDER BY", anchor: "q", cypher: "MATCH (p:Person) MATCH (q:Person) WHERE q = p RETURN q.name AS name ORDER BY {hole}, name"}
  - {name: "a WITH that drops p, in its WHERE", anchor: "q", cypher: "MATCH (p:Person) WITH p AS q WHERE {hole} RETURN q.name ORDER BY q.name"}
  - {name: "a WITH that drops p, in its ORDER BY", anchor: "q", cypher: "MATCH (p:Person) WITH p AS q ORDER BY {hole}, q.name RETURN q.name"}
  - {name: "a WITH that drops p and groups, in its WHERE", anchor: "q", cypher: "MATCH (p:Person) WITH p AS q, count(*) AS c WHERE {hole} RETURN q.name ORDER BY q.name"}
  - {name: "a WITH that drops p and groups, in its ORDER BY", anchor: "q", cypher: "MATCH (p:Person) WITH p AS q, count(*) AS c ORDER BY {hole}, q.name RETURN q.name"}
  - {name: "a DISTINCT WITH that drops p, in its WHERE", anchor: "q", cypher: "MATCH (p:Person) WITH DISTINCT p AS q WHERE {hole} RETURN q.name ORDER BY q.name"}
  - {name: "a DISTINCT WITH that drops p, in its ORDER BY", anchor: "q", cypher: "MATCH (p:Person) WITH DISTINCT p AS q ORDER BY {hole}, q.name RETURN q.name"}
nesting:
  - {name: "EXISTS { pattern }", kind: "expr", hole: "pattern", cypher: "EXISTS { {hole} }"}
  - {name: "EXISTS { MATCH … RETURN }", kind: "expr", hole: "query", cypher: "EXISTS { {hole} }"}
  - {name: "COUNT { pattern }", kind: "expr", hole: "pattern", cypher: "COUNT { {hole} } > 0"}
  - {name: "COUNT { MATCH … RETURN }", kind: "expr", hole: "query", cypher: "COUNT { {hole} } > 0"}
  - {name: "a pattern comprehension", kind: "expr", hole: "pattern", cypher: "size([{hole} | 1]) > 0"}
  - {name: "a list comprehension's WHERE", kind: "expr", hole: "expr", anchor: "w{d}", cypher: "size([w{d} IN [{v}] WHERE {hole}]) > 0"}
  - {name: "CALL with an import list", kind: "query", hole: "query", cypher: "CALL ({v}) { {hole} } RETURN {v} AS {col}"}
  - {name: "CALL () with none", kind: "query", hole: "query", anchor: "n{d}", cypher: "CALL () { {hole} } RETURN {v} AS {col}"}
  - {name: "CALL with a leading WITH", kind: "query", hole: "query", cypher: "CALL { WITH {v} {hole} } RETURN {v} AS {col}"}
  - {name: "a subquery's WITH that groups, in its WHERE", kind: "query", hole: "expr", cypher: "WITH {v}, count(*) AS c{d} WHERE {hole} RETURN {v} AS {col}"}
  - {name: "a subquery's WITH that groups, in its ORDER BY", kind: "query", hole: "expr", cypher: "WITH {v}, count(*) AS c{d} ORDER BY {hole} RETURN {v} AS {col}"}
  - {name: "a subquery's WITH that groups, after it", kind: "query", hole: "query", column: "{col}", cypher: "WITH {v}, count(*) AS c{d} {hole}"}
  - {name: "a subquery's WITH that doesn't group, in its WHERE", kind: "query", hole: "expr", cypher: "WITH {v} WHERE {hole} RETURN {v} AS {col}"}
  - {name: "a subquery's WITH that doesn't group, in its ORDER BY", kind: "query", hole: "expr", cypher: "WITH {v} ORDER BY {hole} RETURN {v} AS {col}"}
  - {name: "a subquery's WITH that doesn't group, after it", kind: "query", hole: "query", column: "{col}", cypher: "WITH {v} {hole}"}
  - {name: "a subquery's ORDER BY", kind: "query", hole: "expr", cypher: "RETURN {v} AS {col} ORDER BY {hole}"}
  - {name: "a subquery's RETURN items", kind: "query", hole: "expr", cypher: "RETURN {hole} AS {col}"}
  - {name: "UNION inside CALL", kind: "query", hole: "query", cypher: "CALL ({v}) { RETURN {v} AS x{d} UNION {hole} } RETURN {v} AS {col}"}
holes:
  expr:
    reference: "{expr}"
    expr: {template: "{inner}"}
  pattern:
    reference: "{pattern}"
    expr: {anchor: "m{d}", template: "({v})-->(m{d}) WHERE {inner}"}
  query:
    reference: "MATCH {pattern} RETURN {v} AS {col}"
    expr: {anchor: "m{d}", template: "MATCH ({v})-->(m{d}) WHERE {inner} RETURN m{d} AS {col}"}
    query: {anchor: "m{d}", template: "MATCH ({v})-->(m{d}) {inner}"}
references:
  - {name: "a QPP group naming p", pattern: "({v}) ((p)-->(b))+ ()", expr: "EXISTS { ({v}) ((p)-->(b))+ () }"}
  - {name: "a QPP group of fresh names", pattern: "({v}) ((a)-->(b))+ ()", expr: "EXISTS { ({v}) ((a)-->(b))+ () }"}
  - {name: "a plain read of p", pattern: "({v})-->() WHERE p.name IS NOT NULL", expr: "p.name IS NOT NULL"}
